name: Dependency audit
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Capture full dependency audit
        shell: bash
        run: |
          mkdir -p artifacts/dependency-audit
          npm audit --json > artifacts/dependency-audit/all.json || true
          npm audit --json --omit=dev > artifacts/dependency-audit/prod.json || true
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['all.json','prod.json']) {
            const j = JSON.parse(fs.readFileSync('artifacts/dependency-audit/'+file,'utf8'));
            const rows = Object.entries(j.vulnerabilities ?? {}).map(([name,v]) => ({
              name,
              severity:v.severity,
              direct:Boolean(v.isDirect),
              range:v.range,
              fix:v.fixAvailable,
              via:(v.via ?? []).map(x => typeof x === 'string' ? x : {
                source:x.source,title:x.title,severity:x.severity,range:x.range,url:x.url
              })
            }));
            console.log('\nAUDIT '+file.toUpperCase());
            console.log(JSON.stringify({metadata:j.metadata, vulnerabilities:rows}, null, 2));
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.event.pull_request.head.sha }}
          path: artifacts/dependency-audit/
          retention-days: 7
          if-no-files-found: error
