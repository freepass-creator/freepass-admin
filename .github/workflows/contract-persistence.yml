name: freepass-data-persistence

on:
  pull_request:
    paths:
      - "src/domain/contracts/**"
      - "src/domain/settlement/**"
      - "src/adapters/erp5/contract-repository.ts"
      - "src/adapters/erp5/settlement-repository.ts"
      - "src/adapters/erp5/firestore.ts"
      - "src/adapters/erp5/__tests__/contract-termination-firestore.integration.ts"
      - "src/adapters/erp5/__tests__/intake-catalog-firestore.integration.ts"
      - "package.json"
      - "firebase.json"
      - ".github/workflows/contract-persistence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-freepass-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: freepasserp5
      ERP5_WRITE: "on"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        run: npm ci

      - name: Firestore FreePass Data persistence
        run: npx --yes firebase-tools@15.30.2 emulators:exec --only firestore --project freepasserp5 "npm run test:freepass-data-firestore"
