name: Branch Hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

jobs:
  verify:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test exact-SHA retirement safety
        run: python3 -m unittest discover -s scripts/tests -p 'test_branch_hygiene.py' -v

  retire-merged-work:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: admin-branch-retirement
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out the trusted integrated main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test safety before any branch mutation
        run: python3 -m unittest discover -s scripts/tests -p 'test_branch_hygiene.py' -v
      - name: Retire reviewed branches without resetting working refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/branch_hygiene.py --apply
