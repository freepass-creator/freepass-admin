name: Finalize Admin integration
on:
  push:
    branches: [release/admin-operational-20260925]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  finalize:
    if: github.repository == 'freepass-creator/freepass-admin' && github.event.head_commit.message == 'release-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply reviewed corrections and remove assembly machinery
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src)" = 80618659b0a4d304588dbb85785b267fada5d9a1
          git apply --check .github/release/operational-fixes.patch
          git apply .github/release/operational-fixes.patch
          git rm .github/release/operational-fixes.patch .github/release/resolve-ui.py .github/release/resolve-esign.py .github/workflows/release-assembly.yml
          git add src
          git -c core.whitespace=-blank-at-eol,-blank-at-eof diff --cached --check
          git config user.name 'FreePass Release Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close integration errors and remove assembly mutation'
          git push origin HEAD:refs/heads/release/admin-operational-20260925
          git rev-parse HEAD
