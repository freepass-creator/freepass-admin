name: admin-core-domain

on:
  # core-domain 은 main 보호 규칙의 «필수 검사» 다. 경로 필터를 걸면 필터 밖 파일만 바꾼 PR(예: .ai-core/ 키트 갱신)에서
  # 이 검사가 아예 돌지 않아 «결과 없음» 으로 머지가 막힌다(2026-10-03 #161). 그래서 모든 PR 에서 돈다.
  # 몇 분짜리 단위 테스트라 늘 돌려도 비용이 작다.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: FreePass Data boundary
        run: npx tsx --test src/server/freepass-data-boundary.test.ts

      - name: Product finder contract
        run: >
          npx tsx --test
          src/domain/search/__tests__/search-contract.test.ts
          src/domain/search/__tests__/finder.test.ts
          src/domain/product/customer-vehicle-class.test.ts
          src/app/products/workspace-config.test.ts

      - name: Intake / performance / settlement / clawback
        run: >
          npx tsx --test
          src/domain/settlement/__tests__/intake.test.ts
          src/domain/settlement/__tests__/catalog-snapshot.test.ts
          src/domain/settlement/__tests__/fee-manual-claw.test.ts
          src/domain/settlement/performance-filter.test.ts
          src/domain/settlement/__tests__/lifecycle.test.ts
          src/domain/settlement/__tests__/ledger-attention.test.ts
