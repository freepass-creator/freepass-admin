<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>계약 접수 데스크</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./admin-shell.retro.css?v=57">
<style>
:root{
  /* 판은 «미색» 이다. 순백을 크게 깔면 오후에 눈이 시리다 */
  /* ★대표 2026-09-17 「사람이 제일 보기 편한 색깔 안정감 들고 피로하지 않은 색깔」
     찾아본 것 —
       ① 가시광 «중간 파장»(녹·황록)이 가장 덜 피로하다. 눈이 한 점에 초점을 맞춘다.
       ② 파랑(400~460nm)은 눈 안에서 흩어져 «색수차» 가 생긴다 — 초점이 한 점에 안 맺혀
          눈이 계속 조절한다. 그래서 약한 세기에도 먼저 피로해진다.
       ③ ★흰색은 «청색광이 가장 많은» 색이다.
     ⇒ 그래서 순백을 크게 깔지 않는다. 대표가 전에 하신 말이 그대로 맞다 —
       「순백을 크게 깔면 오후에 눈이 시리다」. 산뜻하게 한다고 #ffffff 로 바꿨던 것을 되돌린다.
     ⇒ 바탕은 «살짝 녹기» 를 띈 중립으로. 청회색은 차갑고 오래 보면 눈이 당긴다. */
  --ground:#eceee9; --card:#fbfcfa; --tint:#f4f6f2; --tint2:#e8ebe5; --zebra:#f8f9f6;
  --rail:#1b232c; --rail-2:#2a333e; --rail-tx:#aab5c1; --rail-hi:#f2f5f8;
  /* ★선은 «걷는» 게 아니라 «얇고 옅게 있는» 것이다.
     대표 2026-09-17 「적어도 명확하게 목록라인이나 이런건 있어야 하는데」 —
     한 줄을 여덟 칸 가로질러 읽는 표에서 선이 없으면 눈이 줄을 놓친다.
     Stripe 의 데이터 표도 격자선을 «muted 하되 둔다». 없애지 않는다. */
  --line:#e3e8ee; --line-2:#ccd5dd;
  --line-row:#dde4ea;        /* ★표의 «줄 선» — 본문 선보다 한 단 진하다 */
  /* ★글자는 순검정에서 떼되 «읽히는 선» 아래로 안 내린다 (흰 바탕 기준 대비)
     ink 15.9 · ink-2 7.5 · ink-3 4.7 — ★셋 다 «가장 밝은 바탕(--tint)» 기준이다.
     판(--card) 기준으로만 재면 띠 위에서 4.5 아래로 떨어진다.
     예전 #8a939b 은 3.1:1 이라 표 절반이 회색으로 가라앉았다 */
  --ink:#1b2127; --ink-2:#4b5560; --ink-3:#5f6871;
  /* 강조는 «가라앉힌» 슬레이트 블루. 채도가 높으면 초점이 계속 당겨진다 */
  /* ★대표 2026-09-17 「우중충 하지 않게」 —
     전에는 «회색을 섞어» 채도를 낮췄다. 그게 눈은 편한데 칙칙하다.
     ⇒ 회색을 빼고 «맑은» 색으로 두되, 밝기를 낮춰 눈이 안 아프게 한다.
       칙칙함(회색 섞기) 과 차분함(밝기 낮추기) 은 다른 일이다.
     대비는 그대로 지킨다 — key 5.9 · ok 5.1 · warn 5.0 · bad 5.0 (흰 바탕) */
  /* ★대표가 보여준 「뮤카 구독사업 운영 허브」 결 (2026-09-17 「이렇게도 디자인을 하는데」).
     그 산뜻함의 정체는 셋이다 — 민트 강조 · 넉넉한 여백 · 연한 틴트 카드.
     파랑은 회색기가 섞이면 바로 칙칙해지는데, 민트는 밝기를 낮춰도 맑게 남는다.
     ★파랑으로 되돌리려면 이 네 줄만 갈면 된다 (#1766b3 계열). */
  --key:#0c7d73; --key-soft:#e6f6f3; --key-line:#a5ded6; --key-lift:#0f998c;
  --ok:#0f7a51; --ok-soft:#e4f6ec;
  --warn:#8a6212; --warn-soft:#fdf3de;
  --bad:#b5372c; --bad-soft:#fdeae7;
  --ph:#e4e7ea; --ph2:#d5d9dd; --glyph:#b7bec5;
  /* ★«채운 색 위에» 올 글자. 이 토큰이 없어서 어두운 테마가 깨졌다 —
     어두울 때 --key 는 «밝은» 파랑인데 그 위에 흰 글자를 얹고 있었다(2.33:1).
     밝은 벌은 흰 글자, 어두운 벌은 어두운 글자다. */
  --on-fill:#ffffff;
  /* ★판은 «선» 이 아니라 «그림자» 로 뜬다 — 그게 산뜻해 보이는 가장 큰 차이다 */
  --s1:0 1px 2px rgba(23,35,48,.05), 0 0 0 1px rgba(23,35,48,.04);
  --s2:0 2px 4px -1px rgba(23,35,48,.07), 0 4px 14px -6px rgba(23,35,48,.10);
  --s3:0 18px 44px -14px rgba(23,35,48,.30), 0 2px 8px -2px rgba(23,35,48,.10);
  --ring:0 0 0 3px rgba(12,125,115,.22);
  --mono:"Inter",ui-monospace,monospace;
  --sans:"Pretendard","Inter","Noto Sans KR",system-ui,sans-serif;

  /* ── 눈금 ─ 높이는 «넷» 뿐이다 ────────────────────────────
     chip 22  딱지·상태·작은 단추 — 누르지만 «읽는» 것에 가깝다
     ctl  30  입력칸·도구 단추   — 손이 «고르는» 것
     row  34  표 한 줄           — 눈이 «훑는» 것
     act  38  실행 단추·띠 높이  — 손이 «누르는» 것. 구역을 가르는 자리도 이 높이 */
  /* ★대표 2026-09-17 「목록은 휑하니…」 — 키웠던 것을 도로 당겼다.
     여백이 «과하면» 화면이 비어 보이고, 하루 여덟 시간 훑는 사람에게는
     한 화면에 덜 들어오는 만큼 스크롤이 는다. 산뜻함은 여백의 «양» 이 아니라 «리듬» 이다. */
  /* ★★단추 높이는 «하나» 다 — 대표 2026-09-17
       「누르는 단추의 규격은 다 위계 맞춰서 동일해야지
         가로 사이즈는 차이가 날것이지만 «세로 사이즈는 동일»해야지」

     ★그리고 이건 내가 정한 게 아니다. 규격이 이미 있었다 —
       C:\devi-core\design-system	okens.css  `--control-height`  «하나»
       C:\devi-core\docs\SCREEN_DESIGN_STANDARD.md §7
         「Interactive targets use a 44px minimum control height for touch
          usability. WCAG's minimum target-size requirement remains the
          compliance floor.」
       셋(38·30·22)으로 나눠 놨던 건 «규격을 안 보고» 한 것이다.

     ⇒ 44 는 «손가락» 규격이다. 마우스로 하루 여덟 시간 훑는 목록 화면에
       44 단추를 박으면 줄(34)보다 단추가 커진다.
       그래서 두 값으로 나눈다 — «규격을 어기는 게 아니라 규격대로» 다:
         마우스  28px  WCAG 2.2 AA 2.5.8 의 바닥(24×24)을 넘는다
         터치    44px  AI Core 가 권하는 손가락 값 그대로
       위계는 «가로 폭» 과 «면의 무게» 가 진다. 세로는 «절대» 안 진다. */
  --h-btn:28px;
  --h-chip:22px; --h-ctl:30px; --h-row:34px; --h-act:38px; --h-top:46px;
  /* ── 사이 ─ 여섯이 기본, 구역이 갈릴 때만 열둘 ── */
  --sp:6px; --sp2:12px; --sp3:16px;
  --w-find:318px; --w-rail:200px; --w-rail-mini:54px;
  /* ── 모서리 ─ 컨트롤 5 · 판 8 · 딱지 3 ── */
  /* ★대표 2026-09-17 「너무 둥글둥글한데」 — 한 단씩 줄였다.
     업무 화면에서 큰 곡률은 «말랑해» 보이고, 표의 직각과도 안 맞는다. */
  --r-ctl:5px; --r-pane:8px; --r-chip:3px;
  /* ── 폰 ─ 손가락이 닿아야 하므로 한 단 크다 ── */
  --m-bar:52px; --m-ctl:38px; --m-row:64px; --m-act:44px;

  /* ══ AI Core 공통 토큰 — ai-core@fde10bc design-system/tokens.css ══
     ★이름은 «저쪽 것» 을 쓴다. AI Core 규격이 「두 번째 경쟁 체계를 박지 말고
       토큰을 확장하라」 고 못박았기 때문이다 (SCREEN_DESIGN_STANDARD §Tokens).
     ★값이 다른 항목은 docs/dev/AI-CORE-CONFORMANCE.md 에 «전부» 까닭과 함께 적었다.
       요지: AI Core 기본값은 손가락·16px 기준이고, 여기는 마우스로 하루 여덟 시간
       보는 내부 데스크다. 밀도만 다르고 «규범» 은 그대로 지킨다. */
  --color-bg:var(--ground);          --color-surface:var(--card);
  --color-text:var(--ink);           --color-muted:var(--ink-2);
  --color-border:var(--line);        --color-control-border:var(--line-2);
  --color-primary:var(--key);        --color-primary-hover:var(--key-lift);
  --color-danger:var(--bad);         --color-danger-hover:#8b3a32;
  --color-success:var(--ok);         --color-focus:#a8571a;
  --color-info-surface:var(--key-soft);
  --color-error-surface:var(--bad-soft);
  --color-disabled-surface:var(--tint2);
  --space-1:4px;  --space-2:var(--sp);  --space-3:var(--sp2);
  --space-4:var(--sp3); --space-6:24px; --space-8:32px;
  --radius-sm:var(--r-ctl); --radius-md:var(--r-pane);
  --shadow-sm:var(--s1);
  --font-sans:var(--sans);
  --font-size-sm:10.5px; --font-size-md:12px; --font-size-lg:14px;
  --line-height:1.5;
  --control-height:var(--h-act);     /* 데스크 38 · 폰은 --m-act 44 */
  --content-max:none;                /* ★전체화면 데스크다 — 1200 으로 가두지 않는다 */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#11151a; --card:#1b2026; --tint:#232a31; --tint2:#2b333b; --zebra:#1f262c;
  --rail:#151a1f; --rail-2:#262d35; --rail-tx:#8e98a3; --rail-hi:#e4e9ee;
  --line:#313941; --line-2:#434d57;
  --ink:#e7ecf1; --ink-2:#b0bac4; --ink-3:#8d97a1;
  --key:#7db0d2; --key-soft:#1e2c37; --key-line:#3e5f76; --key-lift:#95c2de;
  --ok:#7cb695; --ok-soft:#1a2822;
  --warn:#c9aa76; --warn-soft:#2a261c;
  --bad:#cc8f86; --bad-soft:#2b2120;
  --ph:#262c32; --ph2:#1c2126; --glyph:#454d55;
  --on-fill:#10151a;        /* ★어두운 벌의 강조색은 «밝다» — 글자를 어둡게 뒤집는다 */
  --s1:0 1px 1px rgba(0,0,0,.3);
  --s2:0 1px 2px rgba(0,0,0,.35),0 1px 8px -4px rgba(0,0,0,.45);
  --s3:0 16px 40px -12px rgba(0,0,0,.6);
  --ring:0 0 0 2px rgba(111,159,192,.35);
}}
:root[data-theme="dark"]{
  --ground:#11151a; --card:#1b2026; --tint:#232a31; --tint2:#2b333b; --zebra:#1f262c;
  --rail:#151a1f; --rail-2:#262d35; --rail-tx:#8e98a3; --rail-hi:#e4e9ee;
  --line:#313941; --line-2:#434d57;
  --ink:#e7ecf1; --ink-2:#b0bac4; --ink-3:#8d97a1;
  --key:#7db0d2; --key-soft:#1e2c37; --key-line:#3e5f76; --key-lift:#95c2de;
  --ok:#7cb695; --ok-soft:#1a2822;
  --warn:#c9aa76; --warn-soft:#2a261c;
  --bad:#cc8f86; --bad-soft:#2b2120;
  --ph:#262c32; --ph2:#1c2126; --glyph:#454d55;
  --on-fill:#10151a;        /* ★어두운 벌의 강조색은 «밝다» — 글자를 어둡게 뒤집는다 */
  --s1:0 1px 1px rgba(0,0,0,.3);
  --s2:0 1px 2px rgba(0,0,0,.35),0 1px 8px -4px rgba(0,0,0,.45);
  --s3:0 16px 40px -12px rgba(0,0,0,.6);
  --ring:0 0 0 2px rgba(111,159,192,.35);
}

*{box-sizing:border-box}
/* ★전체화면 데스크다 — 페이지 자체는 «구르지 않는다».
   구르는 것은 판 안(.pb)뿐이다. 페이지가 구르면 머리띠·실행띠가 같이 밀려
   「지금 뭘 누르는지」 를 잃는다. 폰은 아래 미디어쿼리에서 다시 연다. */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:12.5px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.004em}
button,input,select,textarea{font:inherit;color:inherit}
/* ★포커스는 «보이고 가려지지 않는다» (WCAG 2.2 AA 2.4.11/2.4.13).
   box-shadow 만 쓰면 겹친 판이 덮는다 — 실선 테두리를 «함께» 둔다. */
:focus-visible{outline:2px solid var(--color-focus);outline-offset:1px;border-radius:4px}
.pb:focus-visible,.pane:focus-visible{outline-offset:-2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{
  transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}
/* ★손가락으로 쓰는 기계면 AI Core 규격값(44) 을 그대로 쓴다 */
@media (pointer:coarse){:root{--h-btn:44px; --h-row:44px}}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
kbd{font-family:var(--mono);font-size:9.5px;font-weight:600;border-radius:3px;padding:2px 5px;background:var(--tint2);color:var(--ink-3);line-height:1}

.app{display:grid;grid-template-columns:var(--w-rail) 1fr;height:100vh;overflow:hidden;transition:grid-template-columns .16s ease}
.app.mini{grid-template-columns:var(--w-rail-mini) 1fr}

/* 접었을 때 — 글자를 지우고 «아이콘만» 남긴다. 자리는 그대로라 손이 안 헤맨다 */
.app.mini .brand{padding:var(--sp2) 0;justify-content:center}
.app.mini .brand .tx,.app.mini nav .lb,.app.mini nav .gl,.app.mini .rfoot .tx{display:none}
.app.mini nav button{justify-content:center;padding:0;position:relative}
.app.mini nav .bd{position:absolute;top:3px;right:6px;margin:0;min-width:15px;padding:0 4px;font-size:9px}
.app.mini .rfoot{display:flex;justify-content:center;padding:var(--sp2) 0}
/* 접힌 메뉴에 손을 대면 이름이 뜬다 — 아이콘만으로는 못 외운다 */
.app.mini nav button::after{content:attr(data-t);position:absolute;left:calc(100% + 8px);top:50%;
  transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11px;padding:4px 9px;border-radius:5px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30}
.app.mini nav button:hover::after{opacity:1}
.railtoggle{width:var(--h-btn);height:var(--h-btn);border:0;border-radius:var(--r-chip);background:rgba(255,255,255,.08);color:#aab4c0;
  cursor:pointer;font-size:12px;display:grid;place-items:center;flex:none}
.railtoggle:hover{background:rgba(255,255,255,.16);color:#fff}

/* ── 레일 ─────────────────────────────── */
.rail{background:var(--rail);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:var(--sp);padding:var(--sp) var(--sp);border-bottom:1px solid rgba(255,255,255,.06)}
.brand .sp{flex:1}
.brand .tx{flex:1;min-width:0}
.brand .sq{width:28px;height:28px;flex:none;border-radius:6px;background:var(--key);display:grid;place-items:center;color:var(--on-fill);font-weight:700;font-size:13px}
.brand b{display:block;color:#fff;font-size:13.5px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.brand span{display:block;font-size:9px;color:var(--rail-tx);letter-spacing:.08em;margin-top:1px}
.rail nav{padding:var(--sp);display:flex;flex-direction:column;gap:1px}
.rail nav .gl{font-size:9.5px;letter-spacing:.11em;color:#5d6875;padding:var(--sp2) var(--sp) var(--sp);font-weight:600}
.rail nav button{height:var(--h-btn);border:0;border-radius:var(--r-ctl);background:none;color:#aab4c0;text-align:left;padding:0 9px;cursor:pointer;font-weight:500;font-size:12.5px;display:flex;align-items:center;gap:9px}
.rail nav button .gi{width:15px;text-align:center;font-size:12px;opacity:.85}
.rail nav button:hover{color:var(--rail-hi);background:rgba(255,255,255,.05)}
.rail nav button[aria-current="true"]{color:#fff;background:var(--rail-2);font-weight:600;box-shadow:inset 2px 0 0 var(--key-lift)}
.rail nav .bd{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;background:rgba(255,255,255,.13);color:#cdd6e0;padding:1px 6px;border-radius:9px;min-width:20px;text-align:center}
.rail nav button[aria-current="true"] .bd{background:rgba(255,255,255,.28);color:#fff}
.rail .rfoot{margin-top:auto;padding:var(--sp2);border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:#5d6875;line-height:1.6}
.rail .rfoot b{display:block;color:#c3ccd6;font-weight:500;font-size:11.5px}

/* ── 상단 ─────────────────────────────── */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{flex:none;height:var(--h-top);background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--sp2);padding:0 var(--sp2)}
.gs{flex:1;max-width:420px;position:relative}
.gs input{width:100%;height:var(--h-ctl);border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--tint);padding:0 54px 0 28px;font-size:12px}
.gs input:focus{outline:none;border-color:var(--key);box-shadow:var(--ring);background:var(--card)}
.gs .mg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;display:flex}
/* ★아이콘은 «한 벌» 이다 — 16 격자 · stroke 1.6 · currentColor.
   전에는 텍스트 글리프를 썼는데, 폰트가 그리는 것이라 굵기가 제각각이고
   글자 기준선에 앉아 위아래로 어긋났다. 그게 「버튼도 가지각색」 으로 보인 까닭이다. */
.ic{flex:none;display:block;vertical-align:middle}
button .ic,a .ic{pointer-events:none}
.gs kbd{position:absolute;right:6px;top:50%;transform:translateY(-50%);pointer-events:none}
.topbar .sp{margin-left:auto}
.tb{height:var(--h-btn);padding:0 10px;border:0;border-radius:var(--r-ctl);background:var(--tint2);
  cursor:pointer;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:var(--sp);
  transition:background .12s ease, transform .06s ease}
.tb:hover{background:var(--line);color:var(--ink)}
.tb:active{transform:translateY(1px)}
.tb .dot{width:6px;height:6px;border-radius:9px;background:var(--bad)}
.who{display:flex;align-items:center;gap:var(--sp);font-size:12px;padding-left:var(--sp2);border-left:1px solid var(--line);margin-left:2px}
.who .av{width:var(--h-ctl);height:var(--h-ctl);border-radius:var(--r-ctl);background:var(--rail-2);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:650}
.who b{font-weight:600;display:block;line-height:1.25}
.who span{color:var(--ink-3);font-size:10.5px}

/* ── 본문 ─────────────────────────────── */
.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--sp2);gap:var(--sp2)}
.phead{flex:none;display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap}
.phead h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.03em}
.phead .sub{color:var(--ink-3);font-size:11.5px}
.kpis{margin-left:auto;display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctl);overflow:hidden;box-shadow:var(--s1)}
.kpi{padding:0 16px;height:var(--h-act);display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);min-width:96px}
.kpi:last-child{border-right:0}
.kpi .k{font-size:10px;color:var(--ink-3);white-space:nowrap}
.kpi .v{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:-.035em;line-height:1.25}
.kpi .v.hot{color:var(--bad)} .kpi .v.ok{color:var(--ok)}

.work{flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,7fr) var(--sp) minmax(360px,3fr);   /* 목록 : 상세 = 7 : 3 */
  grid-template-rows:1fr var(--sp) 1fr;gap:0}
#p1{grid-column:1;grid-row:1}
#p2{grid-column:1;grid-row:3}
#d1{grid-column:3;grid-row:1/4}          /* ★상세는 하나 — 세로로 끝까지 선다 */
.vs{grid-column:2;grid-row:1/4;cursor:col-resize;touch-action:none;position:relative}
.hs{grid-column:1;grid-row:2;cursor:row-resize;touch-action:none;position:relative}
.vs::after,.hs::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--line-2);border-radius:2px;opacity:.9}
.vs::after{width:3px;height:36px} .hs::after{width:36px;height:3px}
.vs:hover::after{background:var(--key);height:56px}
.hs:hover::after{background:var(--key);width:56px}
.pane{background:var(--card);border:0;border-radius:var(--r-pane);box-shadow:var(--s1);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
/* ★띠 셋이 «같은 높이» 다 — 제목줄 · 도구줄 · 발치줄. 판을 여럿 세워도 줄이 맞는다 */
/* ★머리띠에 회색을 깔지 않는다 — 판마다 띠가 하나씩 더 생겨 화면이 층층이 된다.
   흰 바탕에 아래 선 하나면 「여기가 머리」 라는 것이 충분히 읽힌다. */
.ph{flex:none;display:flex;align-items:center;gap:var(--sp);height:var(--h-act);
  padding:0 var(--sp2);border-bottom:1px solid var(--line);background:var(--card)}
.ph h2{margin:0;font-size:13.5px;font-weight:650;letter-spacing:-.025em;white-space:nowrap}
.ph .c{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.ph .sp{margin-left:auto}
.pb{flex:1;min-height:0;overflow:auto}
.pb::-webkit-scrollbar{width:9px;height:9px}
.pb::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid var(--card)}
/* ── ★판 바닥 (.pf) ─ «셈» 자리다 ───────────────────────────
   넣는 것 : 지금 보이는 것을 센 값 — 라벨 + 숫자. 오른쪽(.sp 뒤) 은 판 전체에 거는 행동.
   안 넣는 것 : 설명문 · 훈계 · 도움말. 매일 보는 사람에게 설명은 소음이다.
   높이는 ctl 30 — «읽기만» 하는 띠라 act 38 을 쓰지 않는다 */
.pf{flex:none;height:var(--h-ctl);border-top:1px solid var(--line);background:var(--card);
  padding:0 var(--sp2);display:flex;gap:var(--sp2);align-items:center;font-size:11px;color:var(--ink-2)}
.pf .sp{margin-left:auto}
.pf .t{display:inline-flex;align-items:baseline;gap:5px;white-space:nowrap}
.pf .t i{font-style:normal;color:var(--ink-3)}
.pf .t b{font-family:var(--mono);font-weight:650;font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.pf .t b.bad{color:var(--bad)} .pf .t b.warn{color:var(--warn)} .pf .t b.ok{color:var(--ok)}
/* ★0 은 눌러 둔다 — «없는 것» 이 눈을 끌면 안 된다 */
.pf .t b.z{color:var(--ink-3);font-weight:500}

/* 가르는 선 — 끌어서 위아래 부피를 바꾼다 */


/* 도구줄 */
.bar{flex:none;min-height:var(--h-act);display:flex;gap:var(--sp);align-items:center;align-content:center;
  padding:0 var(--sp2);border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--card)}
/* 줄이 늘면 row-gap 만으로 갈린다 — padding 을 더하면 한 줄일 때 띠가 38 을 넘는다 */
.bar{row-gap:var(--sp)}
.bar .tok{margin-left:0}
/* ★검색칸은 «치는 만큼» 이다. 남는 폭은 걸린 조건이 쓴다 */
/* ★찾는 일은 «한 칸» 안에서 끝난다 — 돋보기 · 친 말 · 지우기 · 세부필터.
   ✕ 가 둘로 보이던 까닭은 type=search 라 브라우저가 «또» 그려서다. text 로 둔다. */
.fd{position:relative;flex:0 0 var(--w-find);max-width:var(--w-find);display:flex;align-items:center;
  height:var(--h-ctl);border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--card);overflow:hidden}
.fd:focus-within{border-color:var(--key);box-shadow:var(--ring)}
@media (max-width:1400px){:root{--w-find:268px}}
.fd input{flex:1;min-width:0;height:100%;border:0;background:none;padding:0 2px 0 26px;font-size:12px;color:var(--ink)}
.fd input:focus{outline:none}
.fd input::-webkit-search-cancel-button,.fd input::-webkit-search-decoration{display:none;-webkit-appearance:none}
.fd .mg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;display:flex}
/* 지우개 ✕ — 아이콘 하나라도 «누르는 것» 이면 같은 높이 · 같은 면이다.
   WCAG 2.2 AA 2.5.8 의 24×24 바닥도 이걸로 넘는다 */
.fd .x{flex:none;width:var(--h-btn);height:var(--h-btn);border:0;border-radius:var(--r-ctl);
  background:none;color:var(--ink-3);cursor:pointer;padding:0;display:inline-flex;
  align-items:center;justify-content:center;transition:background .12s ease, transform .06s ease}
.fd .x:hover{background:var(--tint2);color:var(--ink)}
.fd .x:active{transform:translateY(1px)}
/* 세부필터는 칸 «안에» 산다 — 검색어로 못 자르는 것을 자르는, 같은 일이다 */
/* 세부필터 — 찾는 칸 «안» 에 앉은 단추. 칸의 선을 나누지 않고 면으로만 선다 */
.fd .fx{flex:none;margin-right:2px;padding:0 10px;font-size:11.5px;background:var(--tint2);color:var(--ink-2)}
.fd .fx:hover{background:var(--line);color:var(--ink)}
.fd .fx.on{background:var(--key);color:var(--on-fill);font-weight:600}
.fd .fx.on:hover{background:var(--key-lift)}
.fd .fx .b{font-family:var(--mono);font-size:10px;font-weight:700;min-width:15px;height:15px;padding:0 3px;border-radius:8px;
  background:var(--tint2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center}
/* ★반투명 흰 바탕 위의 흰 글씨는 3.95 다. 칩을 «채워서» 색을 뒤집는다 */
.fd .fx.on .b{background:var(--on-fill);color:var(--key)}
/* ══ ★단추 — «면과 터치감» 으로만 ═══════════════════════════
   대표 2026-09-17 「표는 선과 버튼은 면으로만 이뤄지고」
                  「버튼은 어떻게?? 면과 터치감으로」

   그래서 단추에서 «선» 을 전부 뗐다. 테두리가 있으면 단추가 표의 칸처럼 보이고,
   표에 면이 있으면 표가 단추처럼 보인다. 둘을 섞지 않으면 화면이 저절로 갈린다.

     선을 쓰는 곳  표 · 판의 경계 · 입력칸 · 상태 딱지(.st)
     면을 쓰는 곳  ★누를 수 있는 것 «전부»

   터치감은 셋으로 낸다 —
     ① 높이는 하나(--h-btn). 위계는 «가로 폭» 과 «면의 무게» 가 진다
     ② hover 에 한 단 진해지고
     ③ ★:active 에 1px 내려앉는다 — 이게 「눌렸다」 는 유일한 증거다
   ══════════════════════════════════════════════════════════ */
.btn,.sb,.fd .fx,.tok{
  height:var(--h-btn);border:0;border-radius:var(--r-ctl);cursor:pointer;
  font-size:12px;font-weight:500;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:background .12s ease, transform .06s ease;
  -webkit-tap-highlight-color:transparent}
.btn:active,.sb:active,.fd .fx:active{transform:translateY(1px)}
/* ★포커스 고리를 «키색» 으로 덮지 않는다 — 키색은 「골랐다」 가 이미 쓰고 있다.
   전역 :focus-visible(주황 실선) 을 그대로 물려받는다. AI Core 가 --color-focus 를
   기본색과 «따로» 둔 이유가 이것이다. */
.btn[disabled],.sb[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
/* 일하는 중 — AI Core §28 이 단추에 요구하는 여섯 낯 중 마지막이다
   (default · hover · focus-visible · active · disabled · busy) */
.btn[aria-busy="true"],.sb[aria-busy="true"]{pointer-events:none;position:relative;color:transparent}
.btn[aria-busy="true"]::after,.sb[aria-busy="true"]::after{content:"";position:absolute;width:13px;height:13px;
  border-radius:50%;border:2px solid currentColor;border-top-color:transparent;color:var(--ink-2);
  animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 도구 — 가장 옅은 면. 목록 위에 여럿이 서므로 조용해야 한다 */
.sb{padding:0 11px;background:var(--tint2);color:var(--ink-2)}
.sb:hover{background:var(--line);color:var(--ink)}
/* 달 고르개 — 찾는 칸과 «같은 키» 로 선다 */
.sel{height:var(--h-ctl);padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r-ctl);
  background:var(--card);color:var(--ink);font-size:12px;cursor:pointer}
.sel:focus{outline:none;border-color:var(--key);box-shadow:var(--ring)}
.sb[aria-pressed="true"]{background:var(--key);color:var(--on-fill);font-weight:600}
.sb[aria-pressed="true"]:hover{background:var(--key-lift)}
.sb .b{font-family:var(--mono);font-size:10px;opacity:.85}
/* 고른 갈래 딱지 — 누르는 것이 아니라 «떼는» 것이라 면은 옅게, 안의 ✕ 만 단추다 */
.tok{padding:0 5px 0 9px;background:var(--key-soft);color:var(--key);font-size:11px;font-weight:600;
  gap:4px;cursor:default}
.tok.q{background:var(--tint2);color:var(--ink-2)}
.tok button{border:0;background:none;color:inherit;cursor:pointer;padding:0 2px;font-size:12px;line-height:1}

/* ── 표 (레트로의 밀도) ──────────────── */
table.g{width:100%;border-collapse:collapse;font-size:12px}
/* ★머리줄도 흰 바탕이다. 회색 띠를 깔면 표가 «상자» 로 보이고, 흰 바탕이면 «줄» 로 읽힌다 */
table.g th{position:sticky;top:0;z-index:1;background:var(--card);text-align:left;font-weight:600;
  font-size:10.5px;color:var(--ink-2);height:var(--h-ctl);padding:0 var(--sp2);
  /* ★머리줄과 본문 사이는 «두 단» 진하게 — 여기가 갈리는 자리다 */
  border-bottom:1.5px solid var(--line-2);white-space:nowrap;letter-spacing:.02em}
table.g td{padding:0 var(--sp2);height:var(--h-row);border-bottom:1px solid var(--line-row);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 마지막 줄 밑선은 판 바닥과 겹친다 — 뗀다 */
table.g tbody tr:last-child td{border-bottom:0}
/* ★돈은 오른쪽 정렬 + 고정폭. 자릿수가 맞아야 위아래로 «크기» 가 읽힌다 (Stripe 표의 규칙) */
table.g td.r,table.g th.r{text-align:right}
table.g td.n,table.g td.r{font-variant-numeric:tabular-nums}
table.g tbody tr{cursor:pointer}
/* ★표에는 «면» 을 안 깐다 (대표 2026-09-17 「표는 선과…」).
   얼룩도, 머리 띠도, 고른 줄의 색칠도 전부 뺐다.
   ⇒ 그럼 「어느 줄을 골랐나」 는 무엇이 말하나 — «선» 이 말한다.
     hover  왼쪽에 2px 회색 선
     고른 줄 왼쪽에 3px 키색 선 + 글자를 진하게 + 위아래 선을 키색으로
   색칠 없이도 줄이 또렷하게 선다. 오히려 옆 줄의 글자가 안 죽는다. */
table.g tbody tr:hover td{box-shadow:inset 0 -1px 0 var(--line-2)}
table.g tbody tr:hover td:first-child{box-shadow:inset 2px 0 0 var(--line-2),inset 0 -1px 0 var(--line-2)}
table.g tbody tr.on td{box-shadow:inset 0 -1px 0 var(--key-line),inset 0 1px 0 var(--key-line);color:var(--ink)}
table.g tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--key),inset 0 -1px 0 var(--key-line),inset 0 1px 0 var(--key-line)}
table.g tbody tr.on .nm{color:var(--key)}
table.g .r{text-align:right}
table.g .nm{font-weight:650}
table.g .mut{color:var(--ink-2)}

/* ★칸이 늘면 표를 «찌그러뜨리지» 않는다 — 옆으로 구르게 둔다.
   ERP 목록에서 열 열두 개는 흔하다. 폭에 맞춰 글자를 줄이면
   「연식」 이 「연」 이 되고, 그 순간 아무것도 못 읽는다.
   ★대신 첫 칸(사진·접수일)은 붙여 둔다 — 옆으로 굴러도 «어느 줄» 인지는 잃지 않는다. */
table.g.wide{min-width:1060px}
/* ★옆으로 구를 때 «맨 오른쪽 칸» 도 붙여 둔다.
   접수 목록이 열한 칸이라 화면보다 넓다. 그냥 두면 가장 중요한 「청구월」 이
   제일 먼저 화면 밖으로 밀린다 — 그래서 왼쪽에 「접수일·할 일」, 오른쪽에 「청구월」 을
   못박고 «가운데만» 구르게 한다. 굴러도 「언제 들어온 무엇을, 무엇을 해야 하고,
   몇 월에 청구하나」 는 항상 보인다. */
table.g .pin-r{position:sticky;right:0;z-index:2;background:var(--card);
  box-shadow:inset 1px 0 0 var(--line)}
table.g thead th.pin-r{z-index:3}
/* 글자 칸은 «자라지 못하게» 묶는다 — 안 묶으면 차 이름 하나가 숫자 칸을 다 밀어낸다 */
.wnm{max-width:150px}
.wveh{max-width:200px}
.wch{max-width:130px}
table.g th:first-child,table.g td:first-child{position:sticky;left:0;z-index:2;background:var(--card)}
table.g thead th:first-child{z-index:3}
/* ★첫 칸의 바탕은 «면» 이 아니다 — 옆으로 구를 때 글자가 비쳐 보이지 않게 막는
   가림막이라, 판 바탕색과 «같은» 색이다. 눈에는 아무 면도 안 보인다. */
.thc{width:52px}

/* 덧말 — 「싼타페 MX5 «캘리그래피 2.5 터보»」 처럼 앞말에 매달리는 작은 글자.
   따로 칸을 내주기엔 아깝고, 없으면 무슨 차인지 모르는 것들이 여기 붙는다 */
.sfx{margin-left:5px;font-size:10.5px;color:var(--ink-3);font-weight:400}

/* 「원래 없는 칸」 — 「모르는 칸」(.unk) 과 색을 달리한다.
   다이렉트 건의 영업자는 «없는» 것이지 «모르는» 것이 아니다 */
.dim{color:var(--ink-3);opacity:.6}
.thumb{width:40px;height:26px;border-radius:3px;background:linear-gradient(160deg,var(--ph),var(--ph2));display:inline-grid;place-items:center;vertical-align:middle;overflow:hidden}
.thumb svg{width:100%;height:100%}

.tag{font-size:10.5px;padding:1px 6px;border-radius:var(--r-chip);background:var(--tint2);color:var(--ink-2);white-space:nowrap}
.st{font-size:10.5px;padding:2px 7px;border-radius:var(--r-chip);font-weight:600;white-space:nowrap;display:inline-block;
  background:transparent;box-shadow:inset 0 0 0 1px currentColor;opacity:.92}
.st.ok{color:var(--ok)} .st.wait{color:var(--warn)}
.st.bad{color:var(--bad)} .st.key{color:var(--key)}
.st.mut{color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2)}

/* ── 상세 ─────────────────────────────── */
.dwrap{padding:var(--sp2)}
.dsub,.note p{max-width:72ch}
.dtop{display:grid;grid-template-columns:1fr;gap:var(--sp2);align-items:start}
/* 상세는 읽는 칸이다 — 좁으니 한 줄로 세우고, 표는 «제 안에서» 옆으로 구른다 */
.dwrap table.g{min-width:max-content}
.dwrap .sec{overflow-x:auto}
.shot{border:1px solid var(--line);border-radius:var(--r-ctl);background:linear-gradient(160deg,var(--ph),var(--ph2));height:132px;display:grid;place-items:center;overflow:hidden}
.shot svg{width:100%;height:100%}
.shot .none{color:var(--ink-3);font-size:11px}
.strip{display:flex;gap:var(--sp);margin-top:var(--sp)}
.strip span{flex:1;height:var(--h-ctl);border:1px solid var(--line);border-radius:4px;background:linear-gradient(160deg,var(--ph),var(--ph2));overflow:hidden;cursor:pointer}
.strip span[aria-current="true"]{border-color:var(--key);box-shadow:inset 0 0 0 1px var(--key)}
.strip svg{width:100%;height:100%}
.strip .more{display:grid;place-items:center;background:var(--tint2);font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.dchips{display:flex;gap:var(--sp);flex-wrap:wrap;margin-bottom:var(--sp)}
.dttl{margin:0;font-size:17px;font-weight:700;letter-spacing:-.035em}
.dsub{margin:3px 0 0;color:var(--ink-2);font-size:12px}
.amt{display:flex;align-items:baseline;gap:var(--sp2);margin-top:var(--sp2);padding-bottom:var(--sp2);border-bottom:1px solid var(--line)}
.amt .k{font-size:10.5px;color:var(--ink-3)}
.amt .v{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.045em}
.amt .u{font-size:12px;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0;margin-top:var(--sp2);font-size:12px;border-top:1px solid var(--line)}
.kv dt{color:var(--ink-2);padding:var(--sp) var(--sp2) var(--sp) 0;border-bottom:1px solid var(--line);white-space:nowrap}
.kv dd{margin:0;padding:var(--sp) var(--sp3) var(--sp) 0;border-bottom:1px solid var(--line);font-weight:500;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}

.unk{color:var(--warn);font-weight:500}
.sec{margin-top:var(--sp3)}
.sec h3{margin:0 0 var(--sp2);font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.note{display:flex;gap:var(--sp2);align-items:flex-start;border:1px solid var(--key-line);background:var(--key-soft);border-radius:var(--r-ctl);padding:var(--sp2);margin-top:var(--sp2)}
.note.w{border-color:#e3cd9a;background:var(--warn-soft)}
.note.e{border-color:#e6bbb6;background:var(--bad-soft)}
.note .i{width:17px;height:17px;flex:none;border-radius:9px;background:var(--key);color:var(--on-fill);display:grid;place-items:center;font-size:10px}
.note.w .i{background:var(--warn)} .note.e .i{background:var(--bad)}
.note b{display:block;font-size:12px;font-weight:650;color:var(--key)}
.note.w b{color:var(--warn)} .note.e b{color:var(--bad)}
.note p{margin:2px 0 0;font-size:11.5px;color:var(--ink-2)}
/* ── ★차례 띠 ─ 상세 몸통 «맨 위» 에 한 줄로 선다 ──────────────
   .ph 가 아니라 여기 사는 까닭: .ph 규격은 「제목 · 딸린 수 · 행동」 셋뿐이고
   차례는 그 셋이 아니다. 여기 두면 다섯 칸짜리도 안 눌린다. */
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp);list-style:none;
  margin:0 0 var(--sp2);padding:0 0 var(--sp2);border-bottom:1px solid var(--line)}
.stp{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
.stp .n2{width:17px;height:17px;border-radius:9px;background:var(--tint2);color:var(--ink-3);display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:700}
.stp.on{color:var(--ink);font-weight:650} .stp.on .n2{background:var(--key);color:var(--on-fill)}
.stp.dn .n2{background:var(--ok);color:var(--on-fill)} .stp.dn{color:var(--ink-2)}

/* ── 전자계약 ────────────────────────────────────────────────
   ★색«만»으로 뜻을 말하지 않는다 — 단계는 늘 이름과 함께 선다 (WCAG 1.4.1) */
/* ★화면낭독기 전용 — «눈에는 안 보이되 문서를 늘리지 않는다».
   ⚠ 전에는 position:absolute 만 줘서 자리 잡을 조상이 없었다. 그래서 표 안의
     <caption> 이 문서 바닥까지 뻗어 «페이지가 508px 굴렀다»(실측 2026-09-17).
     화면에는 아무것도 안 보이는데 스크롤만 생기니 까닭을 못 찾는 종류의 버그다.
   ⇒ ① clip-path 로 완전히 접고 ② margin -1px 로 자리를 지우고
     ③ 담는 표를 position:relative 로 만들어 «밖으로 못 나가게» 한다. */
.sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
table.g{position:relative}
.st.key{color:var(--key);box-shadow:inset 0 0 0 1px var(--key-line)}
.flag{display:inline-block;margin-left:4px;font-size:10px;font-weight:700;padding:1px 5px;border-radius:var(--r-chip);
  background:var(--bad);color:var(--on-fill);vertical-align:1px}
.flag.w{background:var(--warn)}
.sb.flagchip{border-style:dashed}
.sb.flagchip[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--on-fill)}

/* ── 펼쳐지는 계약서 줄 — «새 화면이 아니다» ────────────────────
   표 한 줄 아래가 열린다. 이력·금액과 나란히 두고 보라고 이렇게 둔다. */
/* ★펼쳐지는 줄도 «선» 으로 말한다 — 표 안에서는 색칠을 안 한다.
   펼친 몸통만 판 바깥이라 옅은 면을 깐다 (표가 아니라 «서랍» 이라서). */
table.g tr.exp td{box-shadow:inset 0 -1px 0 var(--key-line)}
table.g tr.exp td:first-child{box-shadow:inset 2px 0 0 var(--key),inset 0 -1px 0 var(--key-line)}
table.g tr.expbody td{padding:0;background:var(--tint);border-bottom:1px solid var(--line-2)}
table.g tr.expbody:hover td{background:var(--tint);box-shadow:none}
.ecbox{padding:var(--sp2);white-space:normal}
.ecbox .steps{margin-bottom:var(--sp2)}
.ecbox h5{margin:var(--sp2) 0 var(--sp);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2)}
.ecbox .note{margin-top:0;margin-bottom:var(--sp2)}
.ecbox .ecnote{margin:6px 0 0;font-size:11px;color:var(--ink-2)}
.ecgrid{display:grid;grid-template-columns:150px 1fr;gap:var(--sp2);align-items:start}
@media (max-width:1100px){.ecgrid{grid-template-columns:1fr}}

/* 손님 축 — 관리자 축과 «생김새가 달라야» 한 축으로 안 읽힌다.
   저쪽은 번호 붙은 차례(.steps), 이쪽은 번호 없는 알약이다. */
.ecjour{display:flex;flex-wrap:wrap;gap:4px}
.ecjour span{font-size:10.5px;padding:2px 7px;border-radius:9px;background:var(--tint);color:var(--ink-2)}
.ecjour span.dn{background:var(--ok-soft);color:var(--ok);font-weight:600}
.ecjour span.now{background:var(--warn-soft);color:var(--warn);font-weight:700;box-shadow:inset 0 0 0 1px #d8c191}

/* ★계약서는 «사진 자리» 와 같은 부피(132)를 쓴다 — 판 넷의 가락이 안 흔들린다.
   여기는 읽는 자리가 아니라 «무슨 서식인지» 알아보는 자리다. */
.a4{background:#fff;border:1px solid var(--line-2);border-radius:var(--r-ctl);box-shadow:var(--s1);
  height:132px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.a4h{font-size:11px;font-weight:700;color:#2a3138;border-bottom:1px solid #d7dce1;padding-bottom:6px}
.a4l{height:5px;background:#eef1f4;border-radius:2px} .a4l.s{width:62%}
.a4kv{display:flex;gap:8px;font-size:10.5px}
.a4kv span{color:#5c666f;width:44px;flex:none} .a4kv b{color:#2a3138;font-weight:600}
.a4sign{margin-top:auto;border:1px dashed #b6bfc7;border-radius:3px;height:24px;
  display:grid;place-items:center;font-size:10.5px;color:#5c666f}
.eclink{display:block;font-family:var(--mono);font-size:11px;background:var(--tint);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-chip);padding:6px 8px;word-break:break-all}
/* 두 벌 나란히 — 상세가 좁으면 자동으로 한 벌로 접힌다.
   정책이 스무 줄 넘는 묶음이 있어서, 한 벌로 세우면 스크롤이 끝없이 길어진다 */
.kv.two{grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr)}
.kv.two dt:nth-of-type(odd){padding-left:0}
.kv.two dt:nth-of-type(even){padding-left:var(--sp3)}
@media (max-width:1500px){.kv.two{grid-template-columns:auto minmax(0,1fr)}
  .kv.two dt:nth-of-type(even){padding-left:0}}
.kv dd .st{font-weight:600}
/* 묶음 제목 옆 «몇 줄인지» — 없으면 「다 본 건가」 를 모른다 */
.sec h3 .cnt{display:inline-block;margin-left:6px;padding:0 5px;border-radius:var(--r-chip);
  background:var(--tint2);color:var(--ink-3);font-size:9.5px;font-weight:700;letter-spacing:0;vertical-align:1px}
.sec .why{margin-top:var(--sp2);border:1px solid var(--line);border-radius:var(--r-ctl)}
.sec .why .kv{margin:0 var(--sp2) var(--sp2)}

/* 청구월 띠 — 접수와 정산을 잇는 고리 하나만 «따로» 세운다.
   정해졌으면 조용히, 안 정해졌으면 눈에 걸리게 */
.bill{display:flex;align-items:center;gap:var(--sp2);margin-top:var(--sp2);
  padding:var(--sp) var(--sp2);border-radius:var(--r-ctl);border:1px solid var(--line);background:var(--tint)}
.bill.open{border-color:var(--warn);background:var(--warn-soft)}
.bill .bk{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-2);white-space:nowrap}
.bill .bv{font-size:13px}
.bill .bw{margin-left:auto;font-size:10.5px;color:var(--ink-3);text-align:right}
.bill.open .bw{color:var(--warn)}
.empty.sm{padding:var(--sp3);text-align:left}
.empty.sm b{font-size:12px}

.kv.sm{margin-top:6px}
.kv.sm dt,.kv.sm dd{font-size:11px}
.kv .brk{word-break:break-all;font-size:10px}
/* ★뜻을 나르지 않는 «사이 기호» 다 — aria-hidden 으로 숨기되 눈에는 보이는 값으로 둔다 */
.steps .ar{color:var(--ink-3);font-size:9px}

.dact{flex:none;border-top:1px solid var(--line);background:var(--card);padding:var(--sp2) var(--sp3);
  display:flex;flex-direction:column;gap:var(--sp)}
.dact .memo{width:100%}
.dact .memo input,.dact .memo textarea{width:100%;height:var(--h-ctl);min-height:var(--h-ctl);resize:none;
  border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--card);padding:6px 9px;font-size:12px}
.dact .memo textarea:focus,.dact .memo input:focus{outline:none;border-color:var(--key);box-shadow:var(--ring)}
.dact .row{display:flex;gap:var(--sp);align-items:center}
.dact .row .sp{flex:1}
/* ★주 행동은 «하나» 다. 그것만 채운 색, 나머지는 테두리만 */
.dact .btn.go{min-width:136px}
.mbtn{width:var(--h-btn);height:var(--h-btn);flex:none;padding:0;justify-content:center}
.menuwrap{position:relative}
.menu{position:absolute;bottom:calc(100% + var(--sp));left:0;z-index:40;min-width:196px;background:var(--card);
  border:1px solid var(--line-2);border-radius:var(--r-ctl);box-shadow:var(--s3);padding:4px;display:none}
.menu.on{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:var(--sp);text-align:left;border:0;background:none;
  border-radius:var(--r-chip);height:var(--h-row);padding:0 10px;cursor:pointer;font-size:12px;color:var(--ink-2)}
.menu button:hover{background:var(--tint2);color:var(--ink)}
/* ★위험한 것은 «색» 이 아니라 «자리» 로 뗀다 — 매일 보는 사람은 빨간 버튼을 곧 무시한다 */
.menu .sep{height:1px;background:var(--line);margin:4px 2px}
.menu button.danger{color:var(--bad)}
.dact .grow{flex:1;min-width:0}
/* ★비활성 단추는 «까닭을 곁에» 둔다 (AI Core 화면규격 §Button) */
.whyoff{margin:0 0 var(--sp);font-size:11px;color:var(--ink-2)}

/* ── 프로모션 — 접수에서 넣고 상세에서 읽는다 ─────────────── */
.fld2{display:grid;grid-template-columns:1fr 130px;gap:var(--sp2);align-items:start}
.pctwrap{position:relative}
.pctwrap input{width:100%;padding-right:24px}
.pctwrap .pct{position:absolute;right:9px;top:50%;transform:translateY(-50%);
  font-size:11px;color:var(--ink-2);pointer-events:none}
.promo{margin-top:var(--sp);border:1px solid #d8c191;background:var(--warn-soft);
  border-radius:var(--r-ctl);padding:var(--sp) var(--sp2);display:flex;flex-wrap:wrap;
  align-items:baseline;gap:var(--sp)}
.promo .pk{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--warn);
  text-transform:uppercase;flex:none}
.promo .pv{font-size:11.5px;color:var(--ink)}
.promo .pv b{font-weight:650}
.promo .pw{font-size:11px;color:var(--ink-2);flex-basis:100%}

.dact textarea:focus{outline:none;border-color:var(--key);box-shadow:var(--ring)}
/* ★단추 높이는 셋뿐 — act(38) 실행 · ctl(30) 도구 · chip(22) 줄 안 */
.btn{padding:0 14px;background:var(--tint2);color:var(--ink);
  cursor:pointer;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp);white-space:nowrap}
.btn:hover{background:var(--tint2)}
.btn.go{background:var(--key);border-color:var(--key);color:var(--on-fill);box-shadow:0 1px 2px rgba(23,35,48,.12)}
.btn.go:hover{background:var(--key-lift)}
.btn.red{color:var(--bad);border-color:#e6bbb6;background:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* ★「작은 단추」 는 이제 없다 — «좁은 단추» 가 있을 뿐이다.
   높이는 --h-btn 그대로 두고 가로와 글자만 줄인다 (대표 「세로 사이즈는 동일」). */
.btn.sm{padding:0 9px;font-size:11px;font-weight:500}

/* 신규접수 폼 — 상세 자리에서 «업무» 로 바뀐다 */
.form{display:flex;flex-direction:column;gap:var(--sp2)}
.fld label{display:block;font-size:11px;color:var(--ink-2);margin-bottom:4px;font-weight:500}
.fld label em{font-style:normal;color:var(--bad);margin-left:2px}
.fld input,.fld select{width:100%;height:var(--h-act);border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--card);padding:0 10px;font-size:12.5px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--key);box-shadow:var(--ring)}
.fld .hint{margin-top:4px;font-size:10.5px;color:var(--ink-3)}
.lock{background:var(--tint);border:1px solid var(--line);border-radius:var(--r-ctl);padding:10px var(--sp2)}
.lock .k{font-size:10px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.lock .v{font-weight:650;margin-top:3px}
.lock .v2{color:var(--ink-2);font-size:11.5px;margin-top:2px;font-variant-numeric:tabular-nums}

/* 진행 타임라인 — 어디까지 왔나 */
.tl{list-style:none;margin:var(--sp) 0 0;padding:0 0 0 var(--sp3);position:relative}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:10px;width:2px;background:var(--line)}
.tl li{position:relative;padding:0 0 var(--sp2)}
.tl li::before{content:"";position:absolute;left:-16px;top:4px;width:10px;height:10px;border-radius:9px;background:var(--line-2);border:2px solid var(--card)}
.tl li.on::before{background:var(--ok)}
.tl li.now::before{background:var(--key);box-shadow:0 0 0 3px var(--key-soft)}
.tl .t{font-weight:650;font-size:12px}
.tl li.now .t{color:var(--key)}
.tl .w{font-size:11px;color:var(--ink-3);margin-top:1px}

.empty{padding:40px var(--sp3);text-align:center;color:var(--ink-2)}
.empty b{display:block;font-size:13px;color:var(--ink);margin-bottom:4px}
.empty p{margin:0 0 12px;font-size:11.5px}
.why{border-top:1px solid var(--line);background:var(--tint)}
.why>summary{padding:var(--sp) var(--sp2);cursor:pointer;font-size:11.5px;color:var(--ink-2);list-style:none}
.why>summary::-webkit-details-marker{display:none}
.why>summary b{color:var(--ink)}
.why .w{padding:0 var(--sp2) var(--sp2);font-size:11px;color:var(--ink-2);line-height:1.6}
.why .w em{font-style:normal;color:var(--warn);font-weight:650}
.why .w code{font-family:var(--mono);background:var(--card);border:1px solid var(--line);border-radius:3px;padding:0 4px}

/* 고르는 시트 — 가운데로 뜬다. 오른쪽 서랍(세부필터)과 다른 일이라 자리도 다르다 */
.pick{position:fixed;inset:0;z-index:55;background:rgba(12,17,22,.5);display:grid;place-items:center;padding:var(--sp3)}
.pickbox{width:min(760px,96vw);max-height:80vh;background:var(--card);border-radius:var(--r-pane);
  box-shadow:var(--s3);display:flex;flex-direction:column;overflow:hidden}
.pickbox .ph{border-bottom:1px solid var(--line)}
.pickbox .bar{border-bottom:1px solid var(--line)}
.pickbox .body2{flex:1;min-height:0;overflow:auto}
.pickbox .pf{border-top:1px solid var(--line)}
.pickbox table.g td{cursor:pointer}
.pickbox tbody tr.off td{opacity:.42;cursor:not-allowed}

/* 시트 */
/* ── ★세부필터 — 찾는 칸에서 «떨어지는» 판 ─────────────────
   대표 2026-09-17 「누르면 그냥 바로 아래로」 ·
                   「좌측에 필터항목이 있고 그거 누르면 우측에 쭉 필터값」 ·
                   「필터 나오는거랑 ui ux가 지금 세련되지 못했어」
   고친 것 —
     ① 자리를 찾는 칸 «왼쪽 끝» 에 맞춘다 (전에는 사이드바까지 넘어갔다)
     ② ★빈 체크박스 줄을 걷었다 — 사무 양식처럼 보였다.
        고른 것만 표시가 뜨고, 안 고른 줄은 «값과 건수» 만 남는다.
     ③ 건수를 막대로 먼저 읽게 한다 — 숫자는 그 다음이다
     ④ 고른 것이 맨 위로 온다
   ★markup 은 하나다. 레트로는 retro.css 한 장만 갈아 끼운다. */
.fdrop{position:fixed;inset:0;z-index:50}
.fpanel{position:fixed;background:var(--card);border:1px solid var(--line-2);
