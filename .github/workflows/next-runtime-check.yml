name: Next runtime check
on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/proxy.ts'
      - 'src/server/auth.ts'
      - 'src/server/google-login.ts'
      - 'scripts/check-next-runtime.mjs'
      - '.github/workflows/next-runtime-check.yml'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: next-runtime-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ERP5_WRITE: 'off'
      UI_BROWSER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install isolated runtime browser
        run: |
          npm install --prefix "$RUNNER_TEMP/freepass-runtime-tools" --no-save --package-lock=false playwright@1.55.0
          node "$RUNNER_TEMP/freepass-runtime-tools/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify production Next auth/error/retry boundaries
        run: UI_BROWSER_TOOLS="$RUNNER_TEMP/freepass-runtime-tools" node scripts/check-next-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-runtime-${{ github.event.pull_request.head.sha }}
          path: artifacts/next-runtime/
          retention-days: 7
          if-no-files-found: warn
