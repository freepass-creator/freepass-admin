name: Branch Hygiene

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-hygiene.yml
  pull_request:
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune-initial-legacy-branches:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete only pre-verified merged branch tips
        shell: bash
        env:
          VERIFIED_BRANCHES: |
