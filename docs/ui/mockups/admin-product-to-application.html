<meta charset="utf-8">
<title>관리자가 매일 여는 자리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* ═══════════════════════════════════════════════════
   결 — 선으로 나누지 않는다. 여백과 «면»으로 나눈다.
   테두리를 그을 때마다 화면이 한 칸씩 더 촘촘해 보이고,
   그 촘촘함이 오래된 업무 프로그램의 인상을 만든다.
   ═══════════════════════════════════════════════════ */
:root{
  --ground:#eef2f7; --surface:#ffffff; --sunken:#f4f7fb; --raised:#fbfcfe;
  --rail:#16233b; --rail-2:#22334f; --rail-text:#8a99b4; --rail-on:#ffffff;
  --line:#e8edf3; --line-2:#d5dee8;
  --ink:#0e1726; --ink-2:#55637a; --ink-3:#8593a8;
  --accent:#0d7d9e; --accent-on:#ffffff; --accent-soft:#e4f1f7; --accent-line:#a6cfe1; --accent-lift:#0f92b8;
  --go:#1b3c63; --go-lift:#254e7d;
  --good:#0a7350; --good-soft:#e4f3ec;
  --warn:#8e6206; --warn-soft:#fcf3e2;
  --bad:#ad322a; --bad-soft:#fceeed;
  --photo-a:#e6ecf3; --photo-b:#d3dce6;
  --sh-1:0 1px 2px rgba(16,24,40,.04);
  --sh-2:0 1px 3px rgba(16,24,40,.06),0 6px 16px -6px rgba(16,24,40,.08);
  --sh-3:0 12px 32px -8px rgba(16,24,40,.22),0 2px 8px rgba(16,24,40,.08);
  --ring:0 0 0 3px rgba(13,125,158,.2);
  --r-s:8px; --r-m:11px; --r-l:16px;
  --mono:"Inter",ui-monospace,monospace;
  --sans:"Pretendard","Inter","Noto Sans KR",system-ui,-apple-system,sans-serif;
  --h:42px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#090d14; --surface:#131a26; --sunken:#1a2231; --raised:#1e2735;
  --rail:#0b1220; --rail-2:#1c2942; --rail-text:#7a89a3; --rail-on:#ffffff;
  --line:#232d3d; --line-2:#334054;
  --ink:#e8edf5; --ink-2:#a2aec2; --ink-3:#7a8699;
  --accent:#43b2d6; --accent-on:#04222c; --accent-soft:#102c39; --accent-line:#255c76; --accent-lift:#5fc7e8;
  --go:#3f7fbd; --go-lift:#5494cd;
  --good:#46c191; --good-soft:#102a20;
  --warn:#dfb163; --warn-soft:#2b2417;
  --bad:#e08279; --bad-soft:#2d1b19;
  --photo-a:#202a3a; --photo-b:#161d29;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 3px rgba(0,0,0,.5),0 6px 16px -6px rgba(0,0,0,.6);
  --sh-3:0 14px 34px -8px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(67,178,214,.24);
}}
:root[data-theme="dark"]{
  --ground:#090d14; --surface:#131a26; --sunken:#1a2231; --raised:#1e2735;
  --rail:#0b1220; --rail-2:#1c2942; --rail-text:#7a89a3; --rail-on:#ffffff;
  --line:#232d3d; --line-2:#334054;
  --ink:#e8edf5; --ink-2:#a2aec2; --ink-3:#7a8699;
  --accent:#43b2d6; --accent-on:#04222c; --accent-soft:#102c39; --accent-line:#255c76; --accent-lift:#5fc7e8;
  --go:#3f7fbd; --go-lift:#5494cd;
  --good:#46c191; --good-soft:#102a20;
  --warn:#dfb163; --warn-soft:#2b2417;
  --bad:#e08279; --bad-soft:#2d1b19;
  --photo-a:#202a3a; --photo-b:#161d29;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 1px 3px rgba(0,0,0,.5),0 6px 16px -6px rgba(0,0,0,.6);
  --sh-3:0 14px 34px -8px rgba(0,0,0,.7),0 2px 8px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(67,178,214,.24);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.55;
  -webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-s)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
kbd{font-family:var(--mono);font-size:10px;font-weight:600;border-radius:5px;padding:2px 5px;
  color:var(--ink-3);background:var(--sunken);white-space:nowrap;line-height:1}
.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* ── 시안 머리말 ───────────────────────────────── */
.sheet-page{max-width:1600px;margin:0 auto;padding:32px 24px 72px}
.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:24px;justify-content:space-between}
.masthead h1{margin:0;font-size:27px;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.masthead .sub{margin:6px 0 0;color:var(--ink-2);max-width:68ch}
.stamp{text-align:right;font-size:11px;color:var(--ink-3);line-height:1.8}
.stamp b{display:inline-block;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:2px 10px;font-weight:600}
.rulepanel{margin:18px 0 20px;background:var(--surface);border-radius:var(--r-l);box-shadow:var(--sh-1);overflow:hidden}
.rulepanel>summary{list-style:none;cursor:pointer;padding:14px 22px;display:flex;align-items:center;gap:10px;
  font-weight:600;font-size:13px;letter-spacing:-.01em}
.rulepanel>summary::-webkit-details-marker{display:none}
.rulepanel>summary::after{content:"펼쳐 보기 ▾";margin-left:auto;font-weight:500;font-size:11.5px;color:var(--ink-3)}
.rulepanel[open]>summary::after{content:"접기 ▴"}
.rulepanel>summary:hover{background:var(--sunken)}
.rulepanel>summary .dot{width:6px;height:6px;border-radius:999px;background:var(--accent);flex:none}
.rulepanel #rules{padding:4px 22px 20px}
.rulepanel p{margin:0 0 10px;color:var(--ink-2);max-width:84ch}
.rulepanel p:last-child{margin-bottom:0}
.rulepanel b{color:var(--ink);font-weight:600}
.rulepanel q{color:var(--ink);font-style:normal;quotes:'"' '"'}

/* ── 틀: 패널을 «띄운다» ───────────────────────── */
.app{position:relative;display:grid;grid-template-columns:186px 1fr;gap:12px;min-height:840px}
.rail{background:var(--rail);border-radius:var(--r-l);display:flex;flex-direction:column;padding:18px 10px 14px;overflow:hidden}
.rail .mark{padding:0 10px 16px}
.rail .mark i{display:block;font-style:normal;color:#fff;font-weight:700;font-size:15px;letter-spacing:-.02em}
.rail .mark span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rail-text);margin-top:2px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button{height:40px;border:0;border-radius:10px;background:none;color:var(--rail-text);text-align:left;
  padding:0 12px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:8px;transition:background .12s,color .12s}
.rail nav button:hover{color:#dde3e8;background:rgba(255,255,255,.05)}
.rail nav button[aria-current="true"]{color:var(--rail-on);background:var(--rail-2);font-weight:600}
.rail nav .badge{margin-left:auto;font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.1);color:#c3ccd3;padding:1px 7px;border-radius:999px;min-width:22px;text-align:center}
.rail nav .badge.hot{background:var(--bad);color:#fff}
.rail .who{margin-top:auto;padding:14px 12px 0;color:var(--rail-text);font-size:12px;border-top:1px solid rgba(255,255,255,.07)}
.rail .who b{display:block;color:#fff;font-weight:500}

.work{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;min-width:0}
.col{display:flex;flex-direction:column;min-width:0;background:var(--surface);border-radius:var(--r-l);
  overflow:hidden;box-shadow:var(--sh-2)}
.colhead{min-height:52px;flex:none;display:flex;align-items:center;gap:9px;padding:0 16px}
.colhead h2{margin:0;font-size:13.5px;font-weight:650;letter-spacing:-.015em;white-space:nowrap}
.colhead .n{font-family:var(--mono);font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums;
  background:var(--sunken);border-radius:999px;padding:2px 8px;white-space:nowrap}
.colhead .spacer{margin-left:auto}
.colhead select{height:30px;border:1px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);font-size:12px;padding:0 8px}
.colbody{flex:1;overflow:auto;min-height:0;padding-bottom:6px}
.colfoot{flex:none;padding:9px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:11px;
  color:var(--ink-3);background:var(--sunken)}

.tabs{display:flex;gap:4px;padding:0 12px 10px}
.tabs button{flex:1;height:34px;border:0;border-radius:999px;background:var(--sunken);cursor:pointer;
  color:var(--ink-2);font-weight:500;font-size:12.5px;transition:background .12s,color .12s}
.tabs button:hover{background:var(--line)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-on);font-weight:600}

/* ── 찾기 ──────────────────────────────────────── */
.searchline{display:flex;gap:8px;padding:0 12px 10px}
.searchline .sw{position:relative;flex:1;min-width:0}
.searchline input{height:var(--h);width:100%;border:1px solid var(--line-2);border-radius:var(--r-m);
  background:var(--surface);padding:0 34px 0 13px;transition:border-color .12s,box-shadow .12s}
.searchline input:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.searchline .sw kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);pointer-events:none}
.condbtn{height:var(--h);flex:none;padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r-m);
  background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap;
  transition:border-color .12s,background .12s}
.condbtn:hover{background:var(--sunken)}
.condbtn[data-on="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.condbtn .cnt{font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums;background:var(--accent);
  color:var(--accent-on);padding:1px 6px;border-radius:999px;min-width:19px;text-align:center}

.toks{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:0 12px 10px;font-size:12px;color:var(--ink-3)}
.tok{display:inline-flex;align-items:center;gap:3px;background:var(--accent-soft);color:var(--accent);
  padding:3px 5px 3px 10px;border-radius:999px;font-weight:500;white-space:nowrap;font-size:11.5px}
.tok.read{background:transparent;box-shadow:inset 0 0 0 1px var(--accent-line)}
.tok button{border:0;background:none;color:inherit;cursor:pointer;padding:0 3px;font-size:13px;line-height:1;opacity:.7}
.tok button:hover{opacity:1}
.toks .clr{margin-left:auto;border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:11px;text-decoration:underline}

/* ── 세부필터 시트 — 두 칸 ─────────────────────── */
.sheetwrap{position:absolute;inset:0;z-index:40;background:rgba(10,16,20,.42);backdrop-filter:blur(2px);
  display:flex;flex-direction:column;justify-content:flex-end;border-radius:var(--r-l)}
.sheetbox{background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;height:84%;display:flex;
  flex-direction:column;overflow:hidden;box-shadow:var(--sh-3)}
.sheetbox .shead{display:flex;align-items:center;gap:10px;padding:16px 20px 12px;flex:none}
.sheetbox .shead b{font-size:16px;font-weight:700;letter-spacing:-.02em}
.sheetbox .shead .sp{margin-left:auto}
.sheetbox .shead button{border:0;background:none;cursor:pointer;color:var(--ink-3);font-size:12px}
.sheetbox .shead button:hover{color:var(--ink)}
.sheetbox .shead .x{font-size:18px;line-height:1;width:30px;height:30px;border-radius:999px;background:var(--sunken)}
.sbody{display:flex;flex:1;min-height:0;gap:0}
.smap{width:132px;flex:0 0 132px;overflow-y:auto;background:var(--sunken);padding:6px}
.smap button{display:flex;align-items:center;gap:5px;width:100%;text-align:left;border:0;border-radius:var(--r-s);
  background:none;padding:11px 10px;cursor:pointer;color:var(--ink-2);font-size:12.5px;transition:background .12s}
.smap button:hover{background:rgba(0,0,0,.035)}
.smap button[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:650;box-shadow:var(--sh-1)}
.smap .b{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--accent);color:var(--accent-on);
  padding:0 5px;border-radius:999px}
.svals{flex:1;overflow-y:auto;padding:12px 18px 18px;min-width:0}
.svals .vh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.svals .vh h4{margin:0;font-size:14px;font-weight:700;letter-spacing:-.02em}
.svals .vh span{color:var(--ink-3);font-size:11px}
.svals .vh button{margin-left:auto;border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:11px;text-decoration:underline}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;border-radius:var(--r-s);
  background:none;padding:11px 10px;cursor:pointer;transition:background .12s}
.opt:hover{background:var(--sunken)}
.opt .bx{width:19px;height:19px;flex:none;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--line-2);
  display:grid;place-items:center;font-size:11px;color:transparent;transition:background .12s}
.opt[aria-pressed="true"] .bx{background:var(--accent);box-shadow:none;color:#fff}
.opt .t{flex:1;min-width:0}
.opt .c{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sfoot{flex:none;padding:12px 18px 16px;background:var(--surface)}
.sfoot .btn{width:100%}

/* ── 사진 ─────────────────────────────────────────
   ★사진 위에는 아무것도 얹지 않는다 (대표 2026-09-04). 신원칩만 «우하단».
   ★사진만 둥글게 · 글자는 그냥 밑에. 카드를 나누는 것은 선이 아니라 여백. */
.photo{position:relative;background:radial-gradient(120% 90% at 30% 20%,var(--photo-a),var(--photo-b));
  border-radius:var(--r-m);overflow:hidden;display:grid;place-items:center}
.photo svg{width:100%;height:100%;display:block}
.photo .sig{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
.photo .sig span{background:rgba(10,14,18,.6);color:#fff;font-size:10px;padding:3px 8px;border-radius:999px;
  backdrop-filter:blur(4px);white-space:nowrap;font-weight:500}
.nophoto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink-3);font-size:11px}
.nophoto .ic{font-size:18px;opacity:.4}

/* ── 목록: 행을 «떠 있는 블록»으로. 밑줄로 나누지 않는다 ── */
.prow,.row{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
  margin:0 8px 3px;width:calc(100% - 16px);padding:10px 10px;border-radius:var(--r-m);transition:background .12s}
.prow:hover,.row:hover{background:var(--sunken)}
.prow[aria-current="true"],.row[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line)}
.prow{display:flex;gap:11px;align-items:center}
.prow .photo{flex:0 0 92px;width:92px;height:60px}
.prow .txt{flex:1;min-width:0}
.prow .l1,.row .l1{display:flex;align-items:baseline;gap:8px}
.prow .nm,.row .nm{font-weight:650;font-size:14px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pr,.row .pr{margin-left:auto;font-family:var(--mono);font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.prow .pr s,.row .pr s{color:var(--ink-3);font-weight:450;font-size:11px;text-decoration:none;margin-right:4px}
.row .pr.owed{color:var(--bad)}
.prow .l2,.row .l2{display:flex;align-items:center;gap:5px;margin-top:3px;color:var(--ink-2);font-size:12px;min-width:0}
.prow .l2 .sub,.row .l2 .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .l2 .sep,.row .l2 .sep{color:var(--line-2)}

.mt{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:2px 7px;border-radius:999px;
  background:var(--sunken);color:var(--ink-3);white-space:nowrap}
.mt.partial{background:var(--warn-soft);color:var(--warn)}
.st{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--ink-2);white-space:nowrap;font-weight:500}
.st.wait{background:var(--warn-soft);color:var(--warn)}
.st.done{background:var(--good-soft);color:var(--good)}
.st.dead{background:transparent;color:var(--ink-3);text-decoration:line-through}
.st.issue{background:var(--bad-soft);color:var(--bad)}

.dropped{margin:6px 8px 0;background:var(--sunken);border-radius:var(--r-m);overflow:hidden}
.dropped>summary{padding:11px 14px;cursor:pointer;color:var(--ink-2);font-size:12px;list-style:none;display:flex;align-items:center;gap:7px}
.dropped>summary::-webkit-details-marker{display:none}
.dropped>summary::before{content:"▸";color:var(--ink-3);font-size:9px}
.dropped[open]>summary::before{content:"▾"}
.dropped>summary b{color:var(--ink);font-weight:650}
.drow{padding:0 14px 12px 28px;font-size:12px}
.drow .t{font-weight:650;margin-bottom:3px}
.drow .why{color:var(--ink-2)}
.drow .why em{font-style:normal;color:var(--warn);font-weight:600}
.drow .why code{font-family:var(--mono);font-size:11px;background:var(--surface);border-radius:5px;padding:1px 5px}

.empty{padding:40px 22px;text-align:center}
.empty .big{font-weight:650;font-size:15px;margin-bottom:6px;letter-spacing:-.02em}
.empty p{margin:0 0 16px;color:var(--ink-2);font-size:12.5px}
.empty .try{display:flex;flex-direction:column;gap:6px;max-width:270px;margin:0 auto}
.empty .try button{height:38px;border:0;border-radius:var(--r-m);background:var(--sunken);cursor:pointer;font-size:12.5px}
.empty .try button:hover{background:var(--line)}
.empty .try button b{color:var(--accent)}

/* ── 상세 ──────────────────────────────────────── */
.detail,.pane{padding:4px 16px 0}
.detail .hero{height:196px;margin-bottom:16px}
.detail h3{margin:0;font-size:21px;font-weight:700;letter-spacing:-.03em;text-wrap:balance}
.detail .under{margin:4px 0 0;color:var(--ink-2)}
.note{margin:14px 0 0;background:var(--warn-soft);color:var(--warn);padding:11px 13px;font-size:12px;border-radius:var(--r-m)}
.note b{font-weight:650}
.note.decide{background:var(--bad-soft);color:var(--bad)}
.sechead{display:flex;align-items:baseline;gap:8px;margin:22px 0 8px}
.sechead h4{margin:0;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sechead span{color:var(--ink-3);font-size:11px;margin-left:auto}

/* 사실 표 — 줄마다 선을 긋지 않는다 */
.facts{margin:10px 0 0;display:grid;grid-template-columns:auto 1fr;gap:7px 16px;font-size:12.5px}
.facts dt{color:var(--ink-3);white-space:nowrap}
.facts dd{margin:0;font-variant-numeric:tabular-nums;font-weight:500}
.unk{color:var(--warn);font-style:normal;font-weight:500}

/* Offer — 한 행씩, 떠 있는 카드. 행 전체가 선택 영역 */
.offers{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.offer{display:block;width:100%;text-align:left;background:var(--sunken);border:0;border-radius:var(--r-m);
  padding:12px 13px;cursor:pointer;transition:background .12s,box-shadow .12s}
.offer:hover{background:var(--line)}
.offer[aria-checked="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.offer.miss{opacity:.5}
.offer.miss:hover{background:var(--sunken)}
.offer .top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.offer .term{font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:13px}

/* ══ 상품 화면 ═════════════════════════════════════ */
const optOf = (ax, k) => ax.opts.find(o => o.k === k);
const axOf  = k => AXES.find(a => a.k === k);

/** 검색어에서 조건을 «읽어낸다». 남은 글자는 차종·차명 검색으로 간다. */
function parseQ(){
  let rest = ' ' + S.q + ' ';
  const read = [];
  for (const t of TERMS){
    if (t.re.test(rest)){
      if (!read.some(r => r.axis === t.axis && r.key === t.key)) read.push({ axis:t.axis, key:t.key });
      rest = rest.replace(t.re, ' ');
    }
  }
  return { read, text: rest.trim() };
}

/** 검색어에서 읽은 것 + 세부필터에서 고른 것 = 실제로 걸린 조건. */
function effSel(){
  const { read } = parseQ();
  const out = {};
  for (const [k, v] of Object.entries(S.sel)) if (v?.length) out[k] = [...v];
  for (const r of read){ (out[r.axis] ||= []); if (!out[r.axis].includes(r.key)) out[r.axis].push(r.key); }
  return out;
}
const selCount = sel => Object.values(sel).reduce((n, v) => n + v.length, 0);

/**
 * ★S-02 — Offer 축 조건은 **이 Offer 하나**가 전부 만족해야 한다.
 *   다른 Offer 의 값을 끌어와 없는 조건을 만들지 않는다.
 */
function offerOK(o, sel, skip){
  for (const ax of AXES){
    if (ax.scope !== 'offer' || ax.k === skip) continue;
    const s = sel[ax.k]; if (!s?.length) continue;
    if (!s.some(k => optOf(ax, k).test(o))) return false;
  }
  return true;
}
function passes(p, sel, skip){
  for (const ax of AXES){
    if (ax.scope !== 'product' || ax.k === skip) continue;
    const s = sel[ax.k]; if (!s?.length) continue;
    if (!s.some(k => optOf(ax, k).test(p))) return false;
  }
  return p.offers.some(o => offerOK(o, sel, skip));
}
const textOK = (p, text) => !text || `${p.name} ${p.sub} ${p.supplier} ${p.maker}`.toLowerCase().includes(text.toLowerCase());

/** ★건수는 «그 축을 뺀 나머지 조건»으로 센다(교차 집계). 0건인 값은 안 세운다. */
function countOpt(ax, opt, sel, text){
  return PRODUCTS.filter(p => {
    if (!textOK(p, text) || !passes(p, sel, ax.k)) return false;
    if (ax.scope === 'product') return opt.test(p);
    return p.offers.some(o => offerOK(o, sel, ax.k) && opt.test(o));
  }).length;
}

function evaluate(){
  const sel = effSel(), { text } = parseQ();
  const hits = [], drops = [];
  for (const p of PRODUCTS){
    if (!textOK(p, text)) continue;
    const ok = p.offers.filter(o => offerOK(o, sel, null));
    const prodOK = AXES.every(ax => ax.scope !== 'product' || !sel[ax.k]?.length
      || sel[ax.k].some(k => optOf(ax, k).test(p)));
    if (prodOK && ok.length) hits.push({ p, ok });
    else if (selCount(sel)) drops.push({ p, why: whyDropped(p, sel, prodOK) });
  }
  return { hits, drops, sel };
}

/** ★왜 빠졌는지 «한 줄로» 댄다. 안 대면 직원은 그 뒤로 이 화면의 숫자를 안 믿는다. */
function whyDropped(p, sel, prodOK){
  if (!prodOK){
    const bad = AXES.filter(ax => ax.scope === 'product' && sel[ax.k]?.length
      && !sel[ax.k].some(k => optOf(ax, k).test(p)));
    return { kind:'product', miss: bad.map(ax => `${ax.t} 가 다르다 (이 차는 ${ax.val(p)})`) };
  }
  let best = null;
  for (const o of p.offers){
    const miss = AXES.filter(ax => ax.scope === 'offer' && sel[ax.k]?.length
      && !sel[ax.k].some(k => optOf(ax, k).test(o)));
    if (!best || miss.length < best.miss.length) best = { o, miss };
  }
  return { kind:'offer', o:best.o, miss: best.miss.map(ax => `${ax.t} ${ax.val(best.o)}`) };
}

function syncSel(){
  const { hits } = evaluate();
  if (!hits.length){ S.pid = null; S.oid = null; return; }
  let cur = hits.find(h => h.p.id === S.pid);
  if (!cur){ cur = hits[0]; S.pid = cur.p.id; S.oid = null; }
  if (!S.oid || !cur.ok.some(o => o.id === S.oid)) S.oid = cur.ok[0].id;
}
const prod  = () => PRODUCTS.find(p => p.id === S.pid);
const offer = () => prod()?.offers.find(o => o.id === S.oid);

/* ── 화면 ────────────────────────────────────────── */
function screenProduct(){
  const shop = S.eye === 'shop';
  $('#h1').innerHTML = `<h2>상품</h2><span class="n" id="cnt"></span><span class="spacer"></span>
    <select id="eye" aria-label="보는 눈">
      <option value="admin"${shop?'':' selected'}>관리자 눈</option>
      <option value="shop"${shop?' selected':''}>화이트라벨 눈</option></select>`;
  $('#eye').onchange = e => { S.eye = e.target.value; render(); };

  /* 검색줄 — 조건은 여기서 «말로» 들어온다. 축 전부로 가는 문은 오른쪽 끝. */
  $('#sub1').innerHTML = `
    <div class="searchline">
      <div class="sw"><input type="search" id="q" value="${esc(S.q)}" aria-label="상품 검색"
        placeholder="차종 · 무보증 · 21세 · 36개월 …"><kbd>/</kbd></div>
      <button class="condbtn" id="cond"><span>세부필터</span><span class="cnt" id="condn"></span></button>
    </div>
    <div class="toks" id="toks"></div>`;
  const q = $('#q');
  q.oninput = () => { S.q = q.value; S.mode = 'browse'; refresh(); };
  $('#cond').onclick = () => { S.sheet = true; renderSheet(); };

  refresh();
}

/** 글자칸은 건드리지 않고 나머지만 다시 그린다 — 치는 도중에 포커스를 뺏기지 않는다. */
function refresh(){
  syncSel();
  const { hits, drops, sel } = evaluate();
  const n = selCount(sel);
  $('#cnt').textContent = `${hits.length}건`;
  $('#condn').textContent = n || '';
  $('#condn').style.display = n ? '' : 'none';
  $('#cond').dataset.on = n > 0;
  renderToks(sel);
  renderList(hits, drops);
  renderDetail();
  paneProduct();
  if (S.sheet) renderSheet();
}

function renderToks(sel){
  const { read } = parseQ();
  const isRead = (a,k) => read.some(r => r.axis === a && r.key === k);
  const items = [];
  for (const [ak, keys] of Object.entries(sel)){
    const ax = axOf(ak);
    for (const k of keys){
      const r = isRead(ak, k);
      const o = optOf(ax,k), label = ax.tok ? ax.tok(o) : o.label;
      items.push(`<span class="tok${r?' read':''}" title="${r?'검색어에서 읽음':'세부필터에서 고름'}">${esc(label)}
        ${r ? '' : `<button data-a="${ak}" data-k="${k}" aria-label="떼기">×</button>`}</span>`);
    }
  }
  $('#toks').innerHTML = items.length
    ? `<span>걸린 조건</span>${items.join('')}<span style="font-size:10.5px;opacity:.75">점선 = 검색어</span>
       ${Object.keys(S.sel).some(k=>S.sel[k]?.length) ? '<button class="clr" id="clr">고른 것 지우기</button>' : ''}`
    : `<span>조건 없음 — 판매 가능한 상품 전부</span>`;
  $('#toks').querySelectorAll('.tok button').forEach(b => b.onclick = () => {
    S.sel[b.dataset.a] = (S.sel[b.dataset.a]||[]).filter(x => x !== b.dataset.k); refresh();
  });
  if ($('#clr')) $('#clr').onclick = () => { S.sel = {}; refresh(); };
}

function renderList(hits, drops){
  const shop = S.eye === 'shop';
  let html = '';

  if (hits.length){
    html = hits.map(({ p, ok }) => {
      const lead = ok[0], partial = p.match !== 'TRIM';
      const mt = shop ? (partial ? '<span class="mt partial">상세 확인 필요</span>' : '')
                      : `<span class="mt${partial?' partial':''}">${esc(p.match)}</span>`;
      return `<button class="prow" data-id="${p.id}" aria-current="${p.id===S.pid}">
        ${photoBox(p)}
        <span class="txt">
          <span class="l1"><span class="nm">${esc(p.name)}</span>
            <span class="pr"><s>${lead.term}개월</s>${won(lead.rent)}</span></span>
          <span class="l2"><span class="sub">${esc(p.sub)}</span>
            ${shop?'':`<span class="sep">·</span><span>${esc(p.supplier)}</span>`}</span>
          <span class="l2">${mt}
            ${ok.length>1?`<span class="sep">·</span><span>조건 맞는 것 ${ok.length}가지</span>`:''}</span>
        </span></button>`;
    }).join('');
  } else {
    const sel = effSel();
    const picked = Object.entries(sel).flatMap(([a,ks]) => ks.map(k => ({a,k,label:optOf(axOf(a),k).label})));
    html = `<div class="empty"><div class="big">이 조건을 다 만족하는 상품이 없다</div>
      <p>「없다」는 <b>이 조건에 없다</b>는 뜻이다. 상품이 사라진 것이 아니다.</p>
      <div class="try">${picked.filter(x=>S.sel[x.a]?.includes(x.k)).map(x =>
        `<button data-a="${x.a}" data-k="${x.k}"><b>${esc(x.label)}</b> 떼고 다시 보기</button>`).join('')
        || '<button id="clrq"><b>검색어</b> 지우고 다시 보기</button>'}</div></div>`;
  }

  if (drops.length){
    html += `<details class="dropped"${hits.length?'':' open'}>
      <summary><b>${drops.length}건</b>이 조건에 걸려 빠졌다 — 왜 빠졌나</summary>
      ${drops.map(({ p, why }) => `<div class="drow">
        <div class="t">${esc(p.name)} · ${esc(p.sub)}</div>
        <div class="why">${why.kind === 'product'
          ? why.miss.map(m => `<em>${esc(m)}</em>`).join(' · ') + '.'
          : `가장 가까운 것이 <code>${esc(why.o.id)}</code> 인데 ${why.miss.map(m=>`<em>${esc(m)}</em>`).join(' · ')} 라 안 맞는다.
             다른 Offer 에 맞는 값이 있어도 <b>같은 Offer 하나</b>가 다 만족해야 하므로 섞지 않는다.`}</div>
      </div>`).join('')}</details>`;
  }

  $('#c1').innerHTML = html;
  $('#c1').querySelectorAll('.prow').forEach(b => b.onclick = () => {
    S.pid = b.dataset.id; S.oid = null; syncSel();
    renderList(...Object.values(evaluate()).slice(0,2)); renderDetail(); if (S.mode==='browse') paneProduct();
  });
  $('#c1').querySelectorAll('.empty .try button').forEach(b => b.onclick = () => {
    if (b.id === 'clrq'){ S.q = ''; $('#q').value = ''; }
    else S.sel[b.dataset.a] = (S.sel[b.dataset.a]||[]).filter(x => x !== b.dataset.k);
    refresh();
  });
  $('#f1').innerHTML = `<span><kbd>↑</kbd><kbd>↓</kbd> 이동</span><span><kbd>Enter</kbd> 접수</span>
    <span><kbd>/</kbd> 검색</span><span style="margin-left:auto">자리 복원됨</span>`;
}

function renderDetail(){
  const p = prod(), shop = S.eye === 'shop';
  $('#h2').innerHTML = `<h2>상품 상세</h2><span class="n">${p && !shop ? p.id+' · v'+p.v : ''}</span>`;
  if (!p){
    $('#c2').innerHTML = `<div class="empty"><div class="big">고른 상품이 없다</div>
      <p>왼쪽에서 조건을 하나 떼면 다시 보인다.</p></div>`;
    return;
  }
  const sel = effSel(), anyCond = selCount(sel) > 0;
  const fact = (k,v) => `<dt>${k}</dt><dd>${v ?? '<span class="unk">미확인</span>'}</dd>`;
  const nOk = p.offers.filter(o => offerOK(o, sel, null)).length;
  const sig = [p.match === 'TRIM' ? '트림 확정' : '상세 확인 필요'];
  if (!shop) sig.unshift(p.supplier);

  $('#c2').innerHTML = `<div class="detail">
    ${photoBox(p, 'hero', sig)}
    <h3>${esc(p.name)}</h3><p class="under">${esc(p.sub)}</p>
    ${p.match==='TRIM'?'':`<p class="note"><b>${esc(p.matchLabel)}.</b> 공급사 원문에 그 아래 정보가 없다. 없는 것을 채워 넣지 않았으므로 제원에 <span class="unk">미확인</span>이 남아 있다.</p>`}
    <div class="sechead"><h4>제원</h4></div>
    <dl class="facts">${[
      fact('연식', p.year ? p.year+'년형' : null),
      fact('주행거리', p.mileage != null ? km(p.mileage) : null),
      fact('연료', p.fuel),
      fact('인승', p.seats ? p.seats+'인승' : null),
      fact('색상', p.color),
      shop ? '' : fact('차량번호', p.plate),
      shop ? '' : fact('공급사', p.supplier)].join('')}</dl>
    <div class="sechead"><h4>대여 조건</h4>
      <span>공급사가 실제로 주는 ${p.offers.length}가지${anyCond?` · 조건에 맞는 것 ${nOk}가지`:''}</span></div>
    <div class="offers" role="radiogroup" aria-label="대여 조건">${p.offers.map(o => {
      const pass = offerOK(o, sel, null);
      const miss = AXES.filter(ax => ax.scope==='offer' && sel[ax.k]?.length
        && !sel[ax.k].some(k => optOf(ax,k).test(o)));
      return `<button class="offer${pass?'':' miss'}" role="radio" data-oid="${o.id}"
        aria-checked="${o.id===S.oid}"${pass?'':' tabindex="-1"'}>
        <span class="top">
          <span class="term">${o.term}개월</span>
          <span class="meta">보증금 ${dep(o.dep)} · ${yr(o.mile) ?? '<span class="unk">약정 미확인</span>'}</span>
          <span class="rent">${won(o.rent)}</span>
          <span class="pol">${o.pol.length?o.pol.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):'<span class="pill" style="color:var(--ink-3)">정책 없음</span>'}</span>
          ${pass&&anyCond?'<span class="hit">↳ 걸린 조건을 이 Offer 하나가 다 만족한다 — 그대로 접수로 간다</span>':''}
          ${pass?'':`<span class="no">조건 밖 — ${miss.map(ax=>esc(ax.t+' '+ax.val(o))).join(' · ')}. 지우지 않고 남겨 둔다.</span>`}
        </span></button>`;}).join('')}</div>
    <div class="dockspace"></div></div>
    <div class="dock"><button class="btn">공유</button>
    <button class="btn primary" id="apply">이 조건으로 접수하기 <kbd>Enter</kbd></button></div>`;

  $('#c2').querySelectorAll('.offer').forEach(b => b.onclick = () => {
    const o = p.offers.find(x => x.id === b.dataset.oid);
    if (!offerOK(o, sel, null)) return;   // 조건 밖 행은 «보이기만» 한다
    S.oid = b.dataset.oid; renderDetail(); if (S.mode!=='browse') paneProduct();
  });
  $('#apply').onclick = startNew;
}

/* ── 세부필터 시트 — 왼쪽 축 지도 · 오른쪽 값 ───── */
function renderSheet(){
  if (!S.sheet){ $('#sheet').innerHTML = ''; return; }
  const sel = effSel(), { text } = parseQ();
  const live = AXES.map(ax => ({ ax, opts: ax.opts.map(o => ({ o, c: countOpt(ax, o, sel, text) })).filter(x => x.c > 0) }))
                   .filter(x => x.opts.length);
  if (!live.some(x => x.ax.k === S.sheetAxis)) S.sheetAxis = live[0]?.ax.k;
  const cur = live.find(x => x.ax.k === S.sheetAxis);
  const total = evaluate().hits.length;
  const picked = Object.keys(S.sel).some(k => S.sel[k]?.length);

  $('#sheet').innerHTML = `<div class="sheetwrap" id="swrap"><div class="sheetbox" id="sbox">
    <div class="shead"><b>세부필터</b><span class="sp"></span>
      ${picked?'<button id="sclr">초기화</button>':''}
      <button class="x" id="sx" aria-label="닫기">×</button></div>
    <div class="sbody">
      <nav class="smap" aria-label="조건 항목">${live.map(({ax}) => {
        const n = (S.sel[ax.k]||[]).length + (parseQ().read.filter(r=>r.axis===ax.k).length);
        return `<button data-a="${ax.k}" aria-current="${ax.k===S.sheetAxis}">${esc(ax.t)}
          ${n?`<span class="b">${n}</span>`:''}</button>`;}).join('')}</nav>
      <div class="svals">
        <div class="vh"><h4>${esc(cur.ax.t)}</h4><span>${cur.ax.scope==='offer'?'같은 Offer 안에서 잰다':'차 자체에 대는 잣대'}</span>
          ${(S.sel[cur.ax.k]||[]).length?`<button id="axclr">이 항목 지우기</button>`:''}</div>
        ${cur.opts.map(({o,c}) => {
          const on = (sel[cur.ax.k]||[]).includes(o.k);
          const fromQ = parseQ().read.some(r => r.axis===cur.ax.k && r.key===o.k);
          return `<button class="opt" data-k="${o.k}" aria-pressed="${on}"${fromQ?' disabled title="검색어에서 읽은 조건이다 — 검색창에서 지운다"':''}>
            <span class="bx">✓</span><span class="t">${esc(o.label)}${fromQ?' <span style="color:var(--ink-3);font-size:11px">· 검색어</span>':''}</span>
            <span class="c">${c}</span></button>`;}).join('')}
      </div>
    </div>
    <div class="sfoot"><button class="btn primary" id="sdone">${total}건 보기</button></div>
  </div></div>`;

  $('#swrap').onclick = e => { if (e.target.id === 'swrap'){ S.sheet = false; renderSheet(); } };
  $('#sx').onclick = $('#sdone').onclick = () => { S.sheet = false; renderSheet(); };
  if ($('#sclr')) $('#sclr').onclick = () => { S.sel = {}; refresh(); };
  if ($('#axclr')) $('#axclr').onclick = () => { S.sel[S.sheetAxis] = []; refresh(); };
  $('#sheet').querySelectorAll('.smap button').forEach(b => b.onclick = () => { S.sheetAxis = b.dataset.a; renderSheet(); });
  $('#sheet').querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const k = b.dataset.k, a = S.sheetAxis;
    S.sel[a] ||= [];
    S.sel[a] = S.sel[a].includes(k) ? S.sel[a].filter(x => x !== k) : [...S.sel[a], k];
    refresh();   /* ★적용 단추가 없다 — 고르는 «즉시» 목록이 바뀐다 */
  });
}

/* ── 업무패널 ───────────────────────────────────── */
function startNew(){ if(!prod())return; S.mode='new'; S.draft=null; S.err=false; paneProduct(); }

  const p = prod(), o = offer();

    $('#h3').innerHTML = `<h2>이 상품 최근 접수</h2><span class="spacer"></span><span class="n">${p?'3건':''}</span>`;
    $('#c3').innerHTML = `<div class="pane"><div class="state">아직 고른 일이 없다. 가운데에서 조건을 고르고 <b>접수하기</b>(<kbd>Enter</kbd>)를 누르면 여기가 신규접수로 바뀐다. 왼쪽·가운데는 그대로 남는다.</div>
      ${p?`<div class="lines">${APPS.filter(a=>a.pid===p.id).slice(0,3).map(a=>{const s=appStatus(a);
        return `<div class="ln"><span class="no">${a.no}</span><span class="w">${esc(a.cust)}</span><span class="st ${s.c}">${s.t}</span></div>`;}).join('')
        ||'<div class="ln"><span class="w" style="color:var(--ink-3)">아직 접수가 없다</span></div>'}</div>`:''}</div>`;
    return;
  }
  if (S.mode==='new'){
    $('#h3').innerHTML = `<h2>신규접수</h2><span class="spacer"></span><span class="n">필수 4</span>`;
    $('#c3').innerHTML = `<div class="pane">
      ${S.err?`<div class="errbar"><b>저장하지 못했다.</b> 연결이 끊겼다. 쓴 내용은 그대로 있다 — 다시 누르면 된다. 같은 건이 두 번 들어가지는 않는다.<button id="retry">다시 저장</button></div>`:''}
      <div class="locked"><div class="k">접수 대상 — 검색에서 고른 그대로</div>
        <div class="v">${esc(p.name)} · ${esc(p.sub)}</div>
        <div class="v2">${o.term}개월 · ${won(o.rent)}/월 · 보증금 ${o.dep?won(o.dep):'없음'} · 약정 ${o.mile!=null?km(o.mile)+'/년':'미확인'}</div>
        <button class="chg" id="chg">접수 상품 바꾸기</button></div>
      <div style="height:16px"></div>
      <div class="field"><label for="f-ch">영업채널 <em>*</em></label>
        <select id="f-ch">${CHANNELS.map((c,i)=>`<option${i===1?' selected':''}>${esc(c)}</option>`).join('')}</select>
        <div class="hint">최근에 쓴 값을 미리 채웠다.</div></div>
      <div class="field"><label for="f-st">담당자 <em>*</em></label>
        <select id="f-st">${STAFF.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
        <div class="hint">로그인한 사람으로 채웠다.</div></div>
      <div class="field"><label for="f-nm">고객명 <em>*</em></label><input id="f-nm" placeholder="예: 김서연" autocomplete="off"></div>
      <div class="field"><label for="f-ph">연락처</label><input id="f-ph" placeholder="아직 몰라도 된다" autocomplete="off">
        <div class="hint">필수가 아니다. 상담만 한 건도 접수로 남아야 한다.</div></div></div>
      <div class="dock"><button class="btn" id="cancel">그만두기 <kbd>Esc</kbd></button>
      <button class="btn primary" id="save" disabled>접수 저장 <kbd>Ctrl</kbd>+<kbd>Enter</kbd></button></div>`;
    const nm=$('#f-nm'), sv=$('#save');
    nm.oninput=()=>sv.disabled=!nm.value.trim(); nm.focus();
    $('#chg').onclick=()=>{S.mode='browse';paneProduct();};
    $('#cancel').onclick=()=>{S.mode='browse';paneProduct();};
    sv.onclick=doSave; if($('#retry'))$('#retry').onclick=doSave;
    return;
  }
  const a = S.draft;
  $('#h3').innerHTML = `<h2>접수 완료</h2><span class="spacer"></span><span class="n">${a.no}</span>`;
  $('#c3').innerHTML = `<div class="pane">

      <div class="sm">저장됐다. 같은 건을 다시 눌러도 <b>한 건만</b> 만들어진다 — 저장 요청에 실린 번호로 서버가 막는다.</div></div>
    <div class="locked"><div class="k">접수 당시 조건 — 굳었다</div>
      <div class="v">${esc(a.veh)} · ${esc(a.trim)}</div>

      <div class="v2" style="color:var(--ink-3)">상품 ${esc(a.pid)} · v${a.pv} 기준 · ${esc(a.at)} 굳힘</div></div>

    <div class="dock"><button class="btn primary" id="goIntake">접수 화면에서 이어서 처리</button></div>`;
  $('#goIntake').onclick = () => { S.screen='intake'; S.appNo=a.no; S.appFilter='todo'; S.mode='browse'; render(); };
}

function doSave(){
  const nm=$('#f-nm'); if(!nm||!nm.value.trim())return;
  if(!S.err){ S.err=true; paneProduct(); return; }   /* 첫 번째는 «끊긴» 화면을 보여 준다 */
  const p=prod(), o=offer();
  const a = { no:'A-260916-016', cust:nm.value.trim(), phone:$('#f-ph').value.trim(), veh:p.name, trim:p.sub,
    pid:p.id, pv:p.v, sup:p.supplier, oid:o.id, term:o.term, rent:o.rent, dep:o.dep, mile:o.mile,
    ch:$('#f-ch').value, staff:$('#f-st').value.split(' · ')[0], at:'09-16 14:31',
    contract:false, docs:false, deliv:false, cxl:false };
  APPS = [a, ...APPS];
  S.draft=a; S.mode='detail'; S.err=false; renderNav(); paneProduct();
}

/* ══ 접수 화면 ═════════════════════════════════════ */
const APP_FILTERS = [
  { k:'todo', t:'내가 칠 것', test:a => !a.cxl && !a.deliv },
  { k:'all',  t:'전체',       test:() => true },
  { k:'done', t:'인도완료',   test:a => a.deliv && !a.cxl },
  { k:'cxl',  t:'취소',       test:a => a.cxl },
];

function screenIntake(){
  const f = APP_FILTERS.find(x=>x.k===S.appFilter) || APP_FILTERS[0];
  const list = APPS.filter(f.test);
  if (!list.some(a=>a.no===S.appNo)) S.appNo = list[0]?.no ?? null;
  const a = APPS.find(x=>x.no===S.appNo);

  $('#h1').innerHTML = `<h2>접수 목록</h2><span class="n">${list.length}건</span>`;
  $('#sub1').innerHTML = `<div class="tabs" role="tablist">${APP_FILTERS.map(x=>
    `<button role="tab" data-k="${x.k}" aria-selected="${x.k===S.appFilter}">${x.t}</button>`).join('')}</div>`;
  $('#sub1').querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{S.appFilter=b.dataset.k;screenIntake();});

  $('#c1').innerHTML = list.length ? list.map(x=>{
    const s=appStatus(x);
    return `<button class="row" data-no="${x.no}" aria-current="${x.no===S.appNo}">
      <span class="l1"><span class="nm">${esc(x.cust)}</span><span class="pr"><s>${x.term}개월</s>${won(x.rent)}</span></span>
      <span class="l2"><span class="num" style="color:var(--ink-3);font-size:11px">${x.no}</span>
        <span class="sep">·</span><span class="sub">${esc(x.veh)}</span>
        <span class="sep">·</span><span>${esc(x.ch)}</span>
        <span class="sep">·</span><span class="st ${s.c}">${s.t}</span></span></button>`;}).join('')
    : `<div class="empty"><div class="big">이 칸에 걸린 접수가 없다</div><p>다른 탭을 보시라. 접수가 사라진 것이 아니다.</p></div>`;
  $('#c1').querySelectorAll('.row').forEach(b=>b.onclick=()=>{S.appNo=b.dataset.no;screenIntake();});

  $('#h2').innerHTML = `<h2>접수 상세</h2><span class="n">${a?a.no:''}</span>`;

  const drift = cur && cur.v !== a.pv;
  $('#c2').innerHTML = `<div class="detail">
    <h3>${esc(a.cust)}</h3>
    <p class="under">${a.phone ? esc(a.phone) : '<span class="unk">연락처 미입력</span>'} · ${esc(a.ch)} · ${esc(a.staff)}</p>
    ${a.cxl?`<p class="note decide"><b>취소된 접수다.</b> ${esc(a.cxlReason)} — 지우지 않고 이유와 함께 남긴다.</p>`:''}
    ${drift?`<p class="note"><b>지금 상품은 v${cur.v} 인데 이 접수는 v${a.pv} 를 보고 받았다.</b> 그 사이에 상품이 바뀌었다. <b>접수 조건은 안 바뀐다</b> — 아래는 접수 당시 값 그대로다. 바꿔야 한다면 사람이 정해서 명시적으로 고친다.</p>`:''}
    <div class="sechead"><h4>접수 당시 조건</h4><span>${esc(a.at)} 굳힘 · 상품 ${esc(a.pid)} v${a.pv}</span></div>
    <dl class="facts">
      <dt>차량</dt><dd>${esc(a.veh)} · ${esc(a.trim)}</dd>
      <dt>공급사</dt><dd>${esc(a.sup)}</dd>
      <dt>선택 Offer</dt><dd class="num">${esc(a.oid)}</dd>
      <dt>대여기간</dt><dd>${a.term}개월</dd>
      <dt>월 대여료</dt><dd>${won(a.rent)}</dd>
      <dt>보증금</dt><dd>${a.dep?won(a.dep):'없음'}</dd>
      <dt>약정주행</dt><dd>${a.mile!=null?km(a.mile)+'/년':'<span class="unk">미확인</span>'}</dd>
    </dl>
    <div class="sechead"><h4>이력</h4><span>덮지 않고 쌓는다</span></div>
    <ul class="hist">
      <li><span class="t">${esc(a.at)}</span><span class="w"><b>접수</b> — ${esc(a.staff)}</span></li>
      ${a.contract?`<li><span class="t">09-16 10:02</span><span class="w"><b>계약서</b> 완료</span></li>`:''}
      ${a.docs?`<li><span class="t">09-16 11:20</span><span class="w"><b>필수서류</b> 완료</span></li>`:''}
      ${a.deliv?`<li><span class="t">09-16 15:40</span><span class="w"><b>인도</b> 완료 — 실적 후보로 넘어감</span></li>`:''}
      ${a.cxl?`<li><span class="t">09-12 17:11</span><span class="w"><b>취소</b> — ${esc(a.cxlReason)}</span></li>`:''}
    </ul><div class="dockspace"></div></div>`;

  /* 업무 */
  const steps = [['contract','계약서'],['docs','필수서류'],['deliv','인도']];
  const nextKey = a.cxl ? null : steps.find(([k])=>!a[k])?.[0];
  $('#h3').innerHTML = `<h2>진행 업무</h2><span class="spacer"></span><span class="n">${appStatus(a).t}</span>`;
  $('#c3').innerHTML = `<div class="pane">
    ${a.cxl?`<div class="state"><b>취소된 접수라 진행을 바꿀 수 없다.</b> 되살리려면 새 접수로 받는다 — 취소 이력을 지우지 않는다.</div>`:''}
    <ul class="steps">${steps.map(([k,t])=>`<li class="${a[k]?'on':''}"><span class="tick">✓</span><span class="nm">${t}</span>
      <span class="when">${a[k]?'완료':'—'}</span></li>`).join('')}</ul>
    <p class="lede" style="margin-top:8px">셋은 서로 독립이다. 서류가 늦어도 계약서는 이미 있을 수 있다. <b>차량준비</b>는 우리 업무가 아니라 만들지 않는다.</p>
    ${a.deliv&&!a.cxl?`<div class="done" style="margin-top:14px"><div class="no">실적 후보</div>
      <div class="sm">인도가 찍혀서 실적으로 넘어갔다. 한 접수에서 실적이 두 번 생기지는 않는다.</div></div>`:''}</div>
    <div class="dock">
      ${a.cxl?'':`<button class="btn danger" id="cxl">접수 취소</button>`}
      ${nextKey?`<button class="btn primary" id="next">${steps.find(([k])=>k===nextKey)[1]} 완료로 표시</button>`
        :(a.cxl?'':`<button class="btn primary" id="toPerf">실적 화면으로</button>`)}</div>`;
  if ($('#next')) $('#next').onclick = () => { a[nextKey]=true; screenIntake(); renderNav(); };
  if ($('#toPerf')) $('#toPerf').onclick = () => { S.screen='perf'; const m=PERFS.find(p=>p.app===a.no); if(m)S.perfNo=m.no; render(); };
  if ($('#cxl')) $('#cxl').onclick = () => { a.cxl=true; a.cxlReason='관리자 취소 — 사유 입력 화면이 뜬다'; screenIntake(); renderNav(); };
}

/* ══ 실적 화면 ═════════════════════════════════════ */
function screenPerf(){
  if (!PERFS.some(p=>p.no===S.perfNo)) S.perfNo = PERFS[0]?.no;
  const pf = PERFS.find(p=>p.no===S.perfNo);
  const app = pf && APPS.find(a=>a.no===pf.app);

  $('#h1').innerHTML = `<h2>실적 목록</h2><span class="n">${PERFS.length}건</span>`;
  $('#sub1').innerHTML = '';
  $('#c1').innerHTML = PERFS.map(p=>{
    const a = APPS.find(x=>x.no===p.app);
    const st = p.issue ? {t:'이슈',c:'issue'} : p.stage>=4 ? {t:'확정',c:'done'} : {t:STAGES[p.stage-1]+' 중',c:'wait'};
    return `<button class="row" data-no="${p.no}" aria-current="${p.no===S.perfNo}">
      <span class="l1"><span class="nm">${esc(a.cust)}</span><span class="pr">${won(p.bill - p.pay)}</span></span>
      <span class="l2"><span class="num" style="color:var(--ink-3);font-size:11px">${p.no}</span>
        <span class="sep">·</span><span class="sub">${esc(a.veh)}</span>
        <span class="sep">·</span><span>${esc(a.ch)}</span>
        <span class="sep">·</span><span class="st ${st.c}">${st.t}</span></span></button>`;}).join('');
  $('#c1').querySelectorAll('.row').forEach(b=>b.onclick=()=>{S.perfNo=b.dataset.no;screenPerf();});
  $('#f1').innerHTML = `<span>오른쪽 금액은 <b>우리 마진</b>이다 — 청구액이 아니다</span>`;

  $('#h2').innerHTML = `<h2>실적 상세</h2><span class="n">${pf?pf.no:''}</span>`;
  $('#c2').innerHTML = `<div class="detail">
    <h3>${esc(app.cust)}</h3>
    <p class="under">${esc(app.veh)} · ${esc(app.trim)} · ${app.term}개월</p>
    ${pf.issue?`<p class="note"><b>공급사와 어긋난다.</b> ${esc(pf.note)} — 영업자 지급액에 닿는 어긋남이라 <b>재확인 요청</b>으로 돌려보낸다. 어긋난 채로 확정하지 않는다.</p>`:''}
    <div class="sechead"><h4>돈</h4><span>셋은 다른 값이다</span></div>
    <div class="trio">
      <div><div class="k">공급사 청구액</div><div class="v">${won(pf.bill)}</div></div>
      <div><div class="k">채널 지급액</div><div class="v${pf.pay?'':' zero'}">${pf.pay?won(pf.pay):'없음'}</div></div>
      <div><div class="k">우리 마진</div><div class="v ok">${won(pf.bill-pf.pay)}</div></div>
    </div>
    ${pf.pay===0?`<p class="lede" style="margin-top:8px">${esc(pf.note||'')}</p>`:''}
    <div class="sechead"><h4>근거</h4><span>이 실적이 어디서 왔나</span></div>
    <dl class="facts">
      <dt>접수</dt><dd class="num">${esc(app.no)}</dd>
      <dt>공급사</dt><dd>${esc(app.sup)}</dd>
      <dt>영업채널</dt><dd>${esc(app.ch)}</dd>
      <dt>담당자</dt><dd>${esc(app.staff)}</dd>
      <dt>선택 Offer</dt><dd class="num">${esc(app.oid)} · ${app.term}개월 · ${won(app.rent)}</dd>
    </dl>
    <div class="dockspace"></div></div>`;

  const stage = pf.stage;
  $('#h3').innerHTML = `<h2>공급사 대조 · 확정</h2><span class="spacer"></span><span class="n">${stage}/4</span>`;
  $('#c3').innerHTML = `<div class="pane">
    <ul class="chain">${STAGES.map((t,i)=>{
      const n=i+1, cls = n<stage?'on' : n===stage?'now' : '';
      const d = ['영업자가 자기 실적이 맞는지 먼저 본다','공급사 자료와 맞춰 본다 — 어긋나면 여기서 멈춘다',
                 '어긋남이 풀려야 확정한다','확정액이 청구·지급 원장으로 들어간다'][i];
      return `<li class="${cls}"><div class="t">${t}</div><div class="d">${d}</div>
        ${n<stage?'<div class="when">완료</div>':n===stage?'<div class="when">지금 여기</div>':''}</li>`;}).join('')}</ul>
    ${pf.issue?`<div class="state" style="border-color:var(--bad-line);background:var(--bad-tint);color:var(--bad)">
      <b>이슈가 걸려 있다.</b> 다음으로 못 넘어간다. 영업자에게 돌려보내 수용/이견을 받아야 한다.</div>`:''}
    ${stage>=4?`<div class="done"><div class="no">정산 확정</div><div class="sm">청구 원장(${esc(app.sup)})과 지급 원장(${esc(app.ch)})에 각각 들어갔다. 원장 둘은 따로 선다.</div></div>`:''}
  </div>
  <div class="dock">
    ${pf.issue?`<button class="btn danger" id="reask">재확인 요청</button><button class="btn" id="resolve">이슈 해소</button>`
      : stage===1?`<button class="btn" id="dis">이견 있음</button><button class="btn primary" id="ok">확인</button>`
      : stage===2?`<button class="btn" id="raise">이슈 등록</button><button class="btn primary" id="ok">공급사 확인 완료</button>`
      : stage===3?`<button class="btn primary" id="ok">정산 확정</button>`
      : `<button class="btn primary" id="toSettle">정산 원장에서 보기</button>`}</div>`;
  if($('#ok')) $('#ok').onclick=()=>{pf.stage=Math.min(4,pf.stage+1);screenPerf();renderNav();};
  if($('#raise')) $('#raise').onclick=()=>{pf.issue=true;pf.note=pf.note||'공급사 자료와 어긋남 — 사유 입력 화면이 뜬다';screenPerf();};
  if($('#dis')) $('#dis').onclick=()=>{pf.issue=true;pf.note='영업자가 이견을 냈다 — 사유 입력 화면이 뜬다';screenPerf();};
  if($('#resolve')) $('#resolve').onclick=()=>{pf.issue=false;screenPerf();};
  if($('#reask')) $('#reask').onclick=()=>{pf.stage=1;pf.issue=false;screenPerf();renderNav();};
  if($('#toSettle')) $('#toSettle').onclick=()=>{S.screen='settle';S.ledger='invoice';S.billSup=app.sup;render();};
}

function paintSettleTabs(){
  $('#sub1').innerHTML = `<div class="tabs" role="tablist">
    <button role="tab" data-k="perf" aria-selected="${S.ledger==='perf'}">실적 대조</button>
    <button role="tab" data-k="invoice" aria-selected="${S.ledger==='invoice'}">청구</button>
    <button role="tab" data-k="payout" aria-selected="${S.ledger==='payout'}">지급</button></div>`;
  $('#sub1').querySelectorAll('[role=tab]').forEach(b=>b.onclick=()=>{S.ledger=b.dataset.k;screenSettle();});
}

/* ══ 전자계약 ═════════════════════════════════════ */
const esignSt = e => e.st==='완료'?{t:'완료',c:'done'} : e.st==='서명 대기'?{t:'서명 대기',c:'wait'} : {t:'열람 전',c:'issue'};

function screenEsign(){
  if (!ESIGNS.some(e=>e.no===S.esignNo)) S.esignNo = ESIGNS[0].no;
  const e = ESIGNS.find(x=>x.no===S.esignNo);
  const blocked = !e.to.startsWith('010');

  $('#h1').innerHTML = `<h2>계약 목록</h2><span class="n">${ESIGNS.length}건</span>`;
  $('#sub1').innerHTML = '';
  $('#c1').innerHTML = ESIGNS.map(x=>{const s=esignSt(x);
    return `<button class="row" data-no="${x.no}" aria-current="${x.no===S.esignNo}">
      <span class="l1"><span class="nm">${esc(x.cust)}</span><span class="pr"><s>${x.sent}</s>발송</span></span>
      <span class="l2"><span class="num" style="color:var(--ink-3);font-size:11px">${x.no}</span>
        <span class="sep">·</span><span class="sub">${esc(x.veh)}</span>
        <span class="sep">·</span><span class="st ${s.c}">${s.t}</span></span></button>`;}).join('');
  $('#c1').querySelectorAll('.row').forEach(b=>b.onclick=()=>{S.esignNo=b.dataset.no;screenEsign();});
  $('#f1').innerHTML = `<span>보냈나 · 봤나 · 서명했나는 <b>서로 다른 사실</b>이다</span>`;

  $('#h2').innerHTML = `<h2>계약 상세</h2><span class="n">${e.no}</span>`;
  $('#c2').innerHTML = `<div class="detail">
    <h3>${esc(e.cust)}</h3><p class="under">${esc(e.veh)} · 접수 ${esc(e.app)}</p>
    ${blocked?`<p class="note decide"><b>보낼 곳이 없다.</b> 연락처가 비어 있어 발송이 막혀 있다 — 접수에서 전화번호를 강제하지 않았기 때문이다.
      가짜 번호를 미리 받아 두는 것보다 <b>여기서 받아</b> 보내는 편이 낫다.</p>`:''}
    <div class="feats">
      <div class="feat"><span class="ic">&#9993;</span><div><div class="k">발송</div><div class="v">${esc(e.sent)}</div></div></div>
      <div class="feat"><span class="ic">&#128065;</span><div><div class="k">열람</div><div class="v">${e.seen?esc(e.seen):'<span class="unk">아직 안 봤다</span>'}</div></div></div>
      <div class="feat"><span class="ic">&#9998;</span><div><div class="k">서명</div><div class="v">${e.signed?esc(e.signed):'<span class="unk">아직</span>'}</div></div></div>
    </div>
    <div class="sechead"><h4>문서</h4></div>
    <dl class="facts"><dt>계약서</dt><dd>${esc(e.doc)}</dd><dt>받는 곳</dt><dd>${esc(e.to)}</dd>
      <dt>상태</dt><dd><span class="st ${esignSt(e).c}">${esignSt(e).t}</span></dd></dl>
    ${e.signed?`<div class="okbox"><span class="ic">&#10003;</span><div><b>서명 완료</b>
      <p>서명된 판까지 남겼다 — 나중에 다툴 때 댈 근거가 된다.</p></div></div>`:''}
    <div class="dockspace"></div></div>`;

  $('#h3').innerHTML = `<h2>발송 · 서명</h2><span class="spacer"></span><span class="n">${esignSt(e).t}</span>`;
  $('#c3').innerHTML = `<div class="pane">
    ${blocked?`<div class="field"><label for="eph">받는 연락처 <em>*</em></label>
      <input id="eph" placeholder="010-0000-0000" autocomplete="off">
      <div class="hint">여기서 받아 채운다. 접수는 번호 없이도 남아 있어야 하므로 그때 강제하지 않았다.</div></div>`
      :`<div class="state"><b>${esc(e.to)}</b> 로 보낸다. 재발송해도 <b>덮지 않고 줄로 쌓인다</b>.</div>`}
    <div class="field"><label for="ememo">함께 보낼 말 (선택)</label>
      <textarea id="ememo" maxlength="500" placeholder="예: 서명 후 신분증 사본 부탁드립니다"></textarea>
      <div class="counter" id="ecnt">0/500</div></div>
    <div class="sechead"><h4>이력</h4><span>덮지 않고 쌓는다</span></div>
    <ul class="hist">
      <li><span class="t">${esc(e.sent)}</span><span class="w"><b>발송</b> — ${esc(e.doc)}</span></li>
      ${e.seen?`<li><span class="t">${esc(e.seen)}</span><span class="w"><b>열람</b></span></li>`:''}
      ${e.signed?`<li><span class="t">${esc(e.signed)}</span><span class="w"><b>서명 완료</b></span></li>`:''}
    </ul></div>
    <div class="dock">
      ${e.signed?`<button class="btn">사본 내려받기</button><button class="btn primary" disabled>완료됨</button>`
        :`<button class="btn">계약서 미리보기</button>
          <button class="btn primary" id="esend"${blocked?' disabled':''}>${e.seen?'재발송':'계약서 발송'}</button>`}</div>`;
  const tx = $('#ememo'); if (tx) tx.oninput = () => $('#ecnt').textContent = `${tx.value.length}/500`;
  const ph = $('#eph'); if (ph) ph.oninput = () => { $('#esend').disabled = ph.value.trim().length < 9; };
  const sd = $('#esend'); if (sd) sd.onclick = () => {
    if (blocked) e.to = $('#eph').value.trim();
    e.sent = '09-16 15:40'; e.st = e.seen ? '서명 대기' : '열람 전'; screenEsign(); renderNav(); renderHead();
  };
}

/* ══ 정산 화면 ═════════════════════════════════════ */
function screenSettle(){
  /* ★실적이 여기 첫 탭이다 — 실적은 그 자체가 목적이 아니라 «정산할 것을 고르는 자리»다 */
  if (S.ledger === 'perf'){ screenPerf(); paintSettleTabs(); return; }
  const inv = S.ledger === 'invoice';
  $('#h1').innerHTML = `<h2>${inv?'청구 원장':'지급 원장'}</h2><span class="n">2026-09</span>`;
  paintSettleTabs();

  if (inv){
    $('#c1').innerHTML = BILLS.map(b=>{
      const due=b.fixed-b.got;
      const st = due===0?{t:'수금 완료',c:'done'} : b.got>0?{t:'부분수금',c:'wait'} : b.tax==='미발행'?{t:'계산서 미발행',c:'wait'}:{t:'미수',c:'issue'};
      return `<button class="row" data-k="${esc(b.sup)}" aria-current="${b.sup===S.billSup}">
        <span class="l1"><span class="nm">${esc(b.sup)}</span><span class="pr${due?' owed':''}">${due?won(due):'0원'}</span></span>
        <span class="l2"><span>확정 ${man(b.fixed)}</span><span class="sep">·</span><span>수금 ${man(b.got)}</span>
          <span class="sep">·</span><span>실적 ${b.cnt}건</span><span class="sep">·</span><span class="st ${st.c}">${st.t}</span></span></button>`;}).join('');
    $('#c1').querySelectorAll('.row').forEach(x=>x.onclick=()=>{S.billSup=x.dataset.k;screenSettle();});
    $('#f1').innerHTML = `<span>오른쪽 큰 숫자는 <b>미수액</b>이다 — 청구액이 아니다</span>`;
    detailBill();
  } else {
    $('#c1').innerHTML = PAYS.map(p=>{
      const left=p.fixed-p.paid;
      const st = p.hold?{t:'보류',c:'issue'} : left===0?{t:'지급 완료',c:'done'} : p.paid>0?{t:'부분지급',c:'wait'}:{t:'미지급',c:'wait'};
      return `<button class="row" data-k="${esc(p.ch)}" aria-current="${p.ch===S.payCh}">
        <span class="l1"><span class="nm">${esc(p.ch)}</span><span class="pr${left?' owed':''}">${left?won(left):'0원'}</span></span>
        <span class="l2"><span>확정 ${man(p.fixed)}</span><span class="sep">·</span><span>지급 ${man(p.paid)}</span>
          <span class="sep">·</span><span>실적 ${p.cnt}건</span><span class="sep">·</span><span class="st ${st.c}">${st.t}</span></span></button>`;}).join('');
    $('#c1').querySelectorAll('.row').forEach(x=>x.onclick=()=>{S.payCh=x.dataset.k;screenSettle();});
    $('#f1').innerHTML = `<span>오른쪽 큰 숫자는 <b>미지급액</b>이다 — 확정액이 아니다</span>`;
    detailPay();
  }
}

function detailBill(){
  const b = BILLS.find(x=>x.sup===S.billSup) || BILLS[0];
  const due = b.fixed - b.got;
  $('#h2').innerHTML = `<h2>청구 상세</h2><span class="n">${esc(b.sup)} · ${b.month}</span>`;
  $('#c2').innerHTML = `<div class="detail">
    <h3>${esc(b.sup)}</h3><p class="under">${b.month} 청구 · 확정 실적 ${b.cnt}건</p>
    <div class="sechead"><h4>돈</h4><span>셋을 한 칸에 합치지 않는다</span></div>
    <div class="trio">
      <div><div class="k">청구 확정액</div><div class="v">${won(b.fixed)}</div></div>
      <div><div class="k">실제 수금액</div><div class="v${b.got?' ok':' zero'}">${won(b.got)}</div></div>
      <div><div class="k">미수액</div><div class="v${due?' owed':' zero'}">${won(due)}</div></div>
    </div>
    ${b.got>0&&due>0?`<p class="note"><b>부분수금은 정상이다.</b> 확정액 ${won(b.fixed)} 은 그대로 두고, 들어온 ${won(b.got)} 을 이력으로 더했다. 원금액을 덮어쓰지 않는다.</p>`:''}
    <div class="sechead"><h4>계산서</h4><span>수금과 다른 상태다</span></div>
    <dl class="facts"><dt>세금계산서</dt><dd>${b.tax==='발행'?'<span class="st done">발행</span>':'<span class="st wait">미발행</span>'}</dd>
      <dt>VAT</dt><dd><span class="unk">별도/포함 기준 미확정</span></dd></dl>
    <div class="sechead"><h4>이력</h4><span>덮지 않고 쌓는다</span></div>
    <ul class="hist">${b.hist.map(h=>`<li><span class="t">${h.t}</span><span class="w"><b>${esc(h.w)}</b></span>
      <span class="a">${h.a!=null?won(h.a):''}</span></li>`).join('')}</ul>
    <div class="dockspace"></div></div>`;

  $('#h3').innerHTML = `<h2>청구 업무</h2><span class="spacer"></span><span class="n">${due?'미수 '+man(due):'완료'}</span>`;
  $('#c3').innerHTML = `<div class="pane">
    <div class="state"><b>청구확정 · 계산서 · 수금은 서로 다른 상태다.</b> 계산서를 끊었다고 수금이 된 것이 아니고, 수금이 됐다고 채널 지급이 끝난 것도 아니다.</div>
    ${due?`<div class="field"><label for="amt">수금 등록 금액</label>
      <input id="amt" class="num" value="${due}" inputmode="numeric">
      <div class="hint">남은 미수액을 채워 뒀다. 일부만 들어왔으면 그만큼 적는다 — 부분수금은 정상이다.</div></div>`:
      `<div class="done"><div class="no">수금 완료</div><div class="sm">확정액 전부가 들어왔다. 이 공급사 건에 걸린 채널 지급을 진행할 수 있다.</div></div>`}
  </div>
  <div class="dock">
    ${b.tax==='미발행'?`<button class="btn" id="tax">계산서 처리</button>`:''}
    ${due?`<button class="btn primary" id="got">수금 등록</button>`:`<button class="btn primary" id="toPay">지급 원장으로</button>`}</div>`;
  if($('#tax')) $('#tax').onclick=()=>{b.tax='발행';b.hist.push({t:'09-16',w:'계산서 처리',a:null});screenSettle();};
  if($('#got')) $('#got').onclick=()=>{
    const v=Math.max(0,Math.min(due,parseInt($('#amt').value.replace(/\D/g,''),10)||0));
    if(!v)return; b.got+=v; b.hist.push({t:'09-16',w:'수금 등록 — '+(b.got>=b.fixed?'전액':'부분'),a:v});
    screenSettle(); renderNav();};
  if($('#toPay')) $('#toPay').onclick=()=>{S.ledger='payout';screenSettle();};
}

function detailPay(){
  const p = PAYS.find(x=>x.ch===S.payCh) || PAYS[0];
  const left = p.fixed - p.paid;
  $('#h2').innerHTML = `<h2>지급 상세</h2><span class="n">${esc(p.ch)} · ${p.month}</span>`;
  $('#c2').innerHTML = `<div class="detail">
    <h3>${esc(p.ch)}</h3><p class="under">${p.month} 지급 · 확정 실적 ${p.cnt}건</p>
    ${p.hold?`<p class="note decide"><b>지급 보류 중 — 결정 필요.</b> ${esc(p.holdWhy)}<br>
      <b>「공급사 수금 전에 채널에 지급해도 되나」</b>는 아직 정해지지 않은 정책이다. 화면이 임의로 밀지 않고 멈춰 세운다.</p>`:''}
    <div class="sechead"><h4>돈</h4><span>청구 원장의 값과 «다른» 원장이다</span></div>
    <div class="trio">
      <div><div class="k">지급 확정액</div><div class="v">${won(p.fixed)}</div></div>
      <div><div class="k">실제 지급액</div><div class="v${p.paid?' ok':' zero'}">${won(p.paid)}</div></div>
      <div><div class="k">미지급액</div><div class="v${left?' owed':' zero'}">${won(left)}</div></div>
    </div>
    ${p.paid>0&&left>0?`<p class="note"><b>부분지급도 정상이다.</b> 확정액 ${won(p.fixed)} 은 그대로 두고, 나간 ${won(p.paid)} 을 이력으로 더했다.</p>`:''}
    <div class="sechead"><h4>이력</h4><span>덮지 않고 쌓는다</span></div>
    <ul class="hist">${p.hist.map(h=>`<li><span class="t">${h.t}</span><span class="w"><b>${esc(h.w)}</b></span>
      <span class="a">${h.a!=null?won(h.a):''}</span></li>`).join('')}</ul>
    <div class="dockspace"></div></div>`;

  $('#h3').innerHTML = `<h2>지급 업무</h2><span class="spacer"></span><span class="n">${left?'미지급 '+man(left):'완료'}</span>`;
  $('#c3').innerHTML = `<div class="pane">
    <div class="state"><b>청구 원장과 지급 원장은 따로 선다.</b> 받을 돈이 덜 들어왔다고 줄 돈이 저절로 줄지 않는다 — 둘은 각자의 이력을 갖는다.</div>
    ${p.hold?`<div class="state" style="border-color:var(--bad-line);background:var(--bad-tint);color:var(--bad)">
      <b>보류를 풀려면 사람이 정해야 한다.</b> 이 화면은 정책을 대신 정하지 않는다.</div>`:''}
    ${left&&!p.hold?`<div class="field"><label for="pamt">지급 등록 금액</label>
      <input id="pamt" class="num" value="${left}" inputmode="numeric">
      <div class="hint">남은 미지급액을 채워 뒀다. 일부만 나가면 그만큼 적는다.</div></div>`:''}
    ${left===0?`<div class="done"><div class="no">지급 완료</div><div class="sm">확정액 전부가 나갔다.</div></div>`:''}
  </div>
  <div class="dock">
    ${p.hold?`<button class="btn" id="unhold">보류 풀기</button>`:left?`<button class="btn danger" id="hold">지급 보류</button>`:''}
    ${left&&!p.hold?`<button class="btn primary" id="pay">지급 등록</button>`:''}</div>`;
  if($('#pay')) $('#pay').onclick=()=>{
    const v=Math.max(0,Math.min(left,parseInt($('#pamt').value.replace(/\D/g,''),10)||0));
    if(!v)return; p.paid+=v; p.hist.push({t:'09-16',w:'지급 등록 — '+(p.paid>=p.fixed?'전액':'부분'),a:v});
    screenSettle(); renderNav();};
  if($('#hold')) $('#hold').onclick=()=>{p.hold=true;p.holdWhy='관리자 보류 — 사유 입력 화면이 뜬다';p.hist.push({t:'09-16',w:'지급 보류',a:null});screenSettle();};
  if($('#unhold')) $('#unhold').onclick=()=>{p.hold=false;p.hist.push({t:'09-16',w:'보류 해제',a:null});screenSettle();};
}

/* ══ 껍데기 ════════════════════════════════════════ */
function renderNav(){
  $('#nav').innerHTML = NAV.map(n=>{
    const b = n.badge ? n.badge() : null;
    return `<button data-k="${n.k}" aria-current="${n.k===S.screen}">${n.t}
      ${b?`<span class="badge${n.hot&&b?' hot':''}">${b}</span>`:''}</button>`;}).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.screen=b.dataset.k;S.mode='browse';render();});
}

function renderHead(){
  const H = HEADS[S.screen];
  $('#pagehead').innerHTML = `<div><h2>${esc(H.t)}</h2><p>${esc(H.p)}</p></div>
    <div class="stats">${H.stats().map(([c,k,v]) =>
      `<div class="stat"><span class="ic ${c}">&#9679;</span><div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div></div>`).join('')}</div>`;
  /* 세 칸이 «무슨 차례»인지 이름을 준다. 지금 칸은 틸, 지난 칸은 초록. */
  const at = S.screen === 'product' ? (S.mode === 'browse' ? 1 : 2) : 1;
  $('#stepper').innerHTML = H.steps.map((s,i) => {
    const n = i+1, cls = n < at+1 ? (n === at+1 ? 'on' : (n <= at ? 'done' : '')) : '';
    const k = n === at+1 ? 'on' : n <= at ? 'done' : '';
    return `<div class="step ${k}"><span class="n">${n}</span>${esc(s)}</div>`;
  }).join('');
}

function render(){
  renderNav();
  renderHead();
  const n = NOTES[S.screen] || NOTES.product;
  $('#rules').innerHTML = n.rules;
  $('#legend').innerHTML = n.legend.map(([k,h,p])=>`<section><span class="k">${k}</span><h5>${h}</h5><p>${p}</p></section>`).join('');
  if (S.screen !== 'product'){ S.sheet = false; $('#sheet').innerHTML = ''; }
  ({ product:screenProduct, intake:screenIntake, settle:screenSettle, esign:screenEsign }[S.screen])();
}

/* 키보드 */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
  if (e.key === '/' && !typing && $('#q')){ e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (e.key === 'Escape'){
    if (typing){ e.target.blur(); return; }
    if (S.screen==='product' && S.mode!=='browse'){ S.mode='browse'; S.draft=null; S.err=false; paneProduct(); }
    return;
  }
  if (e.key === 'Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); if(S.screen==='product'&&S.mode==='new') doSave(); return; }
  if (typing) return;

  if (e.key==='ArrowDown' || e.key==='ArrowUp'){
    const d = e.key==='ArrowDown' ? 1 : -1;
    const rows = [...document.querySelectorAll('#c1 .row, #c1 .prow')];
    if (!rows.length) return;
    e.preventDefault();
    let i = rows.findIndex(r=>r.getAttribute('aria-current')==='true');
    rows[Math.min(rows.length-1, Math.max(0, i + d))].click();
    return;
  }
  if (e.key==='Enter' && S.screen==='product' && S.mode==='browse'){ e.preventDefault(); startNew(); }
});

render();
</script>
