<meta charset="utf-8">
<title>계약 접수 데스크</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./admin-shell.retro.css?v=19">
<style>
:root{
  /* 판은 «미색» 이다. 순백을 크게 깔면 오후에 눈이 시리다 */
  --ground:#e5e8ea; --card:#fafbfc; --tint:#f1f3f5; --tint2:#e8ebee; --zebra:#f6f8f9;
  --rail:#252b33; --rail-2:#333b45; --rail-tx:#909aa5; --rail-hi:#e3e7eb;
  --line:#dfe3e7; --line-2:#c5ccd3;
  /* 글자는 순검정에서 뗀다 — 흰 바탕에서 획이 번진다 */
  --ink:#252b31; --ink-2:#5a646d; --ink-3:#8a939b;
  /* 강조는 «가라앉힌» 슬레이트 블루. 채도가 높으면 초점이 계속 당겨진다 */
  --key:#3d6b8e; --key-soft:#e9eef2; --key-line:#b6c8d5; --key-lift:#4a7ca3;
  --ok:#45775d; --ok-soft:#eaf0ec;
  --warn:#856b3a; --warn-soft:#f4f0e7;
  --bad:#94534b; --bad-soft:#f3eae9;
  --ph:#e4e7ea; --ph2:#d5d9dd; --glyph:#b7bec5;
  --s1:0 1px 1px rgba(37,43,49,.04);
  --s2:0 1px 2px rgba(37,43,49,.06),0 1px 8px -4px rgba(37,43,49,.08);
  --s3:0 14px 38px -12px rgba(37,43,49,.30);
  --ring:0 0 0 2px rgba(61,107,142,.30);
  --mono:"Inter",ui-monospace,monospace;
  --sans:"Pretendard","Inter","Noto Sans KR",system-ui,sans-serif;

  /* ── 눈금 ─ 높이는 «넷» 뿐이다 ────────────────────────────
     chip 22  딱지·상태·작은 단추 — 누르지만 «읽는» 것에 가깝다
     ctl  30  입력칸·도구 단추   — 손이 «고르는» 것
     row  34  표 한 줄           — 눈이 «훑는» 것
     act  38  실행 단추·띠 높이  — 손이 «누르는» 것. 구역을 가르는 자리도 이 높이 */
  --h-chip:22px; --h-ctl:30px; --h-row:34px; --h-act:38px; --h-top:46px;
  /* ── 사이 ─ 여섯이 기본, 구역이 갈릴 때만 열둘 ── */
  --sp:6px; --sp2:12px; --sp3:16px;
  --w-find:250px; --w-rail:200px; --w-rail-mini:54px;
  /* ── 모서리 ─ 컨트롤 5 · 판 8 · 딱지 3 ── */
  --r-ctl:5px; --r-pane:8px; --r-chip:3px;
  /* ── 폰 ─ 손가락이 닿아야 하므로 한 단 크다 ── */
  --m-bar:52px; --m-ctl:38px; --m-row:64px; --m-act:44px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#15191d; --card:#1d2227; --tint:#232930; --tint2:#2a3138; --zebra:#20262b;
  --rail:#171b20; --rail-2:#272e35; --rail-tx:#868f99; --rail-hi:#dfe4e9;
  --line:#2c333a; --line-2:#3b444d;
  --ink:#dde3e8; --ink-2:#a2abb4; --ink-3:#7d868f;
  --key:#6f9fc0; --key-soft:#22303a; --key-line:#3d5b70; --key-lift:#87b3d1;
  --ok:#72ab8d; --ok-soft:#1c2a24;
  --warn:#bfa273; --warn-soft:#2b271d;
  --bad:#c08880; --bad-soft:#2c2220;
  --ph:#262c32; --ph2:#1c2126; --glyph:#454d55;
  --s1:0 1px 1px rgba(0,0,0,.3);
  --s2:0 1px 2px rgba(0,0,0,.35),0 1px 8px -4px rgba(0,0,0,.45);
  --s3:0 16px 40px -12px rgba(0,0,0,.6);
  --ring:0 0 0 2px rgba(111,159,192,.35);
}}
:root[data-theme="dark"]{
  --ground:#15191d; --card:#1d2227; --tint:#232930; --tint2:#2a3138; --zebra:#20262b;
  --rail:#171b20; --rail-2:#272e35; --rail-tx:#868f99; --rail-hi:#dfe4e9;
  --line:#2c333a; --line-2:#3b444d;
  --ink:#dde3e8; --ink-2:#a2abb4; --ink-3:#7d868f;
  --key:#6f9fc0; --key-soft:#22303a; --key-line:#3d5b70; --key-lift:#87b3d1;
  --ok:#72ab8d; --ok-soft:#1c2a24;
  --warn:#bfa273; --warn-soft:#2b271d;
  --bad:#c08880; --bad-soft:#2c2220;
  --ph:#262c32; --ph2:#1c2126; --glyph:#454d55;
  --s1:0 1px 1px rgba(0,0,0,.3);
  --s2:0 1px 2px rgba(0,0,0,.35),0 1px 8px -4px rgba(0,0,0,.45);
  --s3:0 16px 40px -12px rgba(0,0,0,.6);
  --ring:0 0 0 2px rgba(111,159,192,.35);
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:12.5px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.004em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
kbd{font-family:var(--mono);font-size:9.5px;font-weight:600;border-radius:3px;padding:2px 5px;background:var(--tint2);color:var(--ink-3);line-height:1}

.app{display:grid;grid-template-columns:var(--w-rail) 1fr;height:100vh;overflow:hidden;transition:grid-template-columns .16s ease}
.app.mini{grid-template-columns:var(--w-rail-mini) 1fr}

/* 접었을 때 — 글자를 지우고 «아이콘만» 남긴다. 자리는 그대로라 손이 안 헤맨다 */
.app.mini .brand{padding:var(--sp2) 0;justify-content:center}
.app.mini .brand .tx,.app.mini nav .lb,.app.mini nav .gl,.app.mini .rfoot .tx{display:none}
.app.mini nav button{justify-content:center;padding:0;position:relative}
.app.mini nav .bd{position:absolute;top:3px;right:6px;margin:0;min-width:15px;padding:0 4px;font-size:9px}
.app.mini .rfoot{display:flex;justify-content:center;padding:var(--sp2) 0}
/* 접힌 메뉴에 손을 대면 이름이 뜬다 — 아이콘만으로는 못 외운다 */
.app.mini nav button::after{content:attr(data-t);position:absolute;left:calc(100% + 8px);top:50%;
  transform:translateY(-50%);background:var(--ink);color:#fff;font-size:11px;padding:4px 9px;border-radius:5px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30}
.app.mini nav button:hover::after{opacity:1}
.railtoggle{width:var(--h-chip);height:var(--h-chip);border:0;border-radius:var(--r-chip);background:rgba(255,255,255,.08);color:#aab4c0;
  cursor:pointer;font-size:12px;display:grid;place-items:center;flex:none}
.railtoggle:hover{background:rgba(255,255,255,.16);color:#fff}

/* ── 레일 ─────────────────────────────── */
.rail{background:var(--rail);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:var(--sp);padding:var(--sp2) var(--sp) var(--sp2) var(--sp2);border-bottom:1px solid rgba(255,255,255,.06)}
.brand .tx{flex:1;min-width:0}
.brand .sq{width:28px;height:28px;flex:none;border-radius:6px;background:var(--key);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.brand b{display:block;color:#fff;font-size:13.5px;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.brand span{display:block;font-size:9px;color:var(--rail-tx);letter-spacing:.08em;margin-top:1px}
.rail nav{padding:var(--sp);display:flex;flex-direction:column;gap:1px}
.rail nav .gl{font-size:9.5px;letter-spacing:.11em;color:#5d6875;padding:var(--sp2) var(--sp) var(--sp);font-weight:600}
.rail nav button{height:var(--h-row);border:0;border-radius:var(--r-ctl);background:none;color:#aab4c0;text-align:left;padding:0 9px;cursor:pointer;font-weight:500;font-size:12.5px;display:flex;align-items:center;gap:9px}
.rail nav button .gi{width:15px;text-align:center;font-size:12px;opacity:.85}
.rail nav button:hover{color:var(--rail-hi);background:rgba(255,255,255,.05)}
.rail nav button[aria-current="true"]{color:#fff;background:var(--rail-2);font-weight:600;box-shadow:inset 2px 0 0 var(--key-lift)}
.rail nav .bd{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:700;background:rgba(255,255,255,.13);color:#cdd6e0;padding:1px 6px;border-radius:9px;min-width:20px;text-align:center}
.rail nav button[aria-current="true"] .bd{background:rgba(255,255,255,.28);color:#fff}
.rail .rfoot{margin-top:auto;padding:var(--sp2);border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:#5d6875;line-height:1.6}
.rail .rfoot b{display:block;color:#c3ccd6;font-weight:500;font-size:11.5px}

/* ── 상단 ─────────────────────────────── */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{flex:none;height:var(--h-top);background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--sp2);padding:0 var(--sp2)}
.gs{flex:1;max-width:420px;position:relative}
.gs input{width:100%;height:var(--h-ctl);border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--tint);padding:0 54px 0 28px;font-size:12px}
.gs input:focus{outline:none;border-color:var(--key);box-shadow:var(--ring);background:var(--card)}
.gs .mg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none;font-size:11px}
.gs kbd{position:absolute;right:6px;top:50%;transform:translateY(-50%);pointer-events:none}
.topbar .sp{margin-left:auto}
.tb{height:var(--h-ctl);padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--card);cursor:pointer;font-size:12px;color:var(--ink-2);display:inline-flex;align-items:center;gap:var(--sp)}
.tb:hover{background:var(--tint)}
.tb .dot{width:6px;height:6px;border-radius:9px;background:var(--bad)}
.who{display:flex;align-items:center;gap:var(--sp);font-size:12px;padding-left:var(--sp2);border-left:1px solid var(--line);margin-left:2px}
.who .av{width:var(--h-ctl);height:var(--h-ctl);border-radius:var(--r-ctl);background:var(--rail-2);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:650}
.who b{font-weight:600;display:block;line-height:1.25}
.who span{color:var(--ink-3);font-size:10.5px}

/* ── 본문 ─────────────────────────────── */
.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:var(--sp2);gap:var(--sp2)}
.phead{flex:none;display:flex;align-items:center;gap:var(--sp2);flex-wrap:wrap}
.phead h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.03em}
.phead .sub{color:var(--ink-3);font-size:11.5px}
.kpis{margin-left:auto;display:flex;align-items:stretch;background:var(--card);border:1px solid var(--line);border-radius:var(--r-ctl);overflow:hidden;box-shadow:var(--s1)}
.kpi{padding:0 16px;height:var(--h-act);display:flex;flex-direction:column;justify-content:center;border-right:1px solid var(--line);min-width:96px}
.kpi:last-child{border-right:0}
.kpi .k{font-size:10px;color:var(--ink-3);white-space:nowrap}
.kpi .v{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:-.035em;line-height:1.25}
.kpi .v.hot{color:var(--bad)} .kpi .v.ok{color:var(--ok)}

.work{flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,7fr) var(--sp) minmax(360px,3fr);   /* 목록 : 상세 = 7 : 3 */
  grid-template-rows:1fr var(--sp) 1fr;gap:0}
#p1{grid-column:1;grid-row:1}
#p2{grid-column:1;grid-row:3}
#d1{grid-column:3;grid-row:1/4}          /* ★상세는 하나 — 세로로 끝까지 선다 */
.vs{grid-column:2;grid-row:1/4;cursor:col-resize;touch-action:none;position:relative}
.hs{grid-column:1;grid-row:2;cursor:row-resize;touch-action:none;position:relative}
.vs::after,.hs::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  background:var(--line-2);border-radius:2px;opacity:.9}
.vs::after{width:3px;height:36px} .hs::after{width:36px;height:3px}
.vs:hover::after{background:var(--key);height:56px}
.hs:hover::after{background:var(--key);width:56px}
.pane{background:var(--card);border:1px solid var(--line);border-radius:var(--r-pane);box-shadow:var(--s1);display:flex;flex-direction:column;min-height:0;overflow:hidden}
/* ★띠 셋이 «같은 높이» 다 — 제목줄 · 도구줄 · 발치줄. 판을 여럿 세워도 줄이 맞는다 */
.ph{flex:none;display:flex;align-items:center;gap:var(--sp);height:var(--h-act);padding:0 var(--sp2);border-bottom:1px solid var(--line);background:var(--tint)}
.ph h2{margin:0;font-size:12.5px;font-weight:650;letter-spacing:-.02em;white-space:nowrap}
.ph .c{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.ph .sp{margin-left:auto}
.pb{flex:1;min-height:0;overflow:auto}
.pb::-webkit-scrollbar{width:9px;height:9px}
.pb::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid var(--card)}
.pf{flex:none;min-height:var(--h-act);border-top:1px solid var(--line);background:var(--tint);padding:0 var(--sp2);font-size:10.5px;color:var(--ink-3);display:flex;gap:10px;align-items:center}

/* 가르는 선 — 끌어서 위아래 부피를 바꾼다 */


/* 도구줄 */
.bar{flex:none;min-height:var(--h-act);display:flex;gap:var(--sp);align-items:center;align-content:center;
  padding:0 var(--sp2);border-bottom:1px solid var(--line);flex-wrap:wrap}
/* 줄이 늘면 row-gap 만으로 갈린다 — padding 을 더하면 한 줄일 때 띠가 38 을 넘는다 */
.bar{row-gap:var(--sp)}
.bar .tok{margin-left:0}
/* ★검색칸은 «치는 만큼» 이다. 남는 폭은 걸린 조건이 쓴다 */
.fd{position:relative;flex:0 0 var(--w-find);max-width:var(--w-find)}
@media (max-width:1400px){:root{--w-find:190px}}
.fd input{width:100%;height:var(--h-ctl);border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--card);padding:0 26px;font-size:12px}
.fd input:focus{outline:none;border-color:var(--key);box-shadow:var(--ring)}
.fd .mg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:11px;pointer-events:none}
.fd .x{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-3);cursor:pointer;padding:3px}
.sb{height:var(--h-ctl);padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--card);cursor:pointer;font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:var(--sp)}
.sb:hover{background:var(--tint)}
.sb[aria-pressed="true"]{background:var(--key);border-color:var(--key);color:#fff;font-weight:600}
.sb .b{font-family:var(--mono);font-size:10px;opacity:.85}
.tok{height:var(--h-chip);padding:0 5px 0 9px;border:1px solid var(--key-line);border-radius:var(--r-chip);background:var(--key-soft);color:var(--key);font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;cursor:default}
.tok.q{border-style:dashed;background:transparent}
.tok button{border:0;background:none;color:inherit;cursor:pointer;padding:0 2px;font-size:12px;line-height:1}

/* ── 표 (레트로의 밀도) ──────────────── */
table.g{width:100%;border-collapse:collapse;font-size:12px}
table.g th{position:sticky;top:0;z-index:1;background:var(--tint);text-align:left;font-weight:600;font-size:10.5px;color:var(--ink-2);
  height:var(--h-ctl);padding:0 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;letter-spacing:.01em}
table.g td{padding:0 10px;height:var(--h-row);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.g tbody tr{cursor:pointer}
table.g tbody tr:nth-child(even) td{background:var(--zebra)}
table.g tbody tr:hover td{background:var(--tint2)}
table.g tbody tr.on td{background:var(--key-soft)}
table.g tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--key)}
table.g tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--key)}
table.g .r{text-align:right}
table.g .nm{font-weight:650}
table.g .mut{color:var(--ink-3)}
.thumb{width:40px;height:26px;border-radius:3px;background:linear-gradient(160deg,var(--ph),var(--ph2));display:inline-grid;place-items:center;vertical-align:middle;overflow:hidden}
.thumb svg{width:100%;height:100%}

.tag{font-size:10.5px;padding:1px 6px;border-radius:var(--r-chip);background:var(--tint2);color:var(--ink-2);white-space:nowrap}
.st{font-size:10.5px;padding:2px 7px;border-radius:var(--r-chip);font-weight:600;white-space:nowrap;display:inline-block;
  background:transparent;box-shadow:inset 0 0 0 1px currentColor;opacity:.92}
.st.ok{color:var(--ok)} .st.wait{color:var(--warn)}
.st.bad{color:var(--bad)} .st.key{color:var(--key)}
.st.mut{color:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-2)}

/* ── 상세 ─────────────────────────────── */
.dwrap{padding:var(--sp2)}
.dsub,.note p{max-width:72ch}
.dtop{display:grid;grid-template-columns:1fr;gap:var(--sp2);align-items:start}
/* 상세는 읽는 칸이다 — 좁으니 한 줄로 세우고, 표는 «제 안에서» 옆으로 구른다 */
.dwrap table.g{min-width:max-content}
.dwrap .sec{overflow-x:auto}
.shot{border:1px solid var(--line);border-radius:var(--r-ctl);background:linear-gradient(160deg,var(--ph),var(--ph2));height:132px;display:grid;place-items:center;overflow:hidden}
.shot svg{width:100%;height:100%}
.shot .none{color:var(--ink-3);font-size:11px}
.strip{display:flex;gap:var(--sp);margin-top:var(--sp)}
.strip span{flex:1;height:var(--h-ctl);border:1px solid var(--line);border-radius:4px;background:linear-gradient(160deg,var(--ph),var(--ph2));overflow:hidden;cursor:pointer}
.strip span[aria-current="true"]{border-color:var(--key);box-shadow:inset 0 0 0 1px var(--key)}
.strip svg{width:100%;height:100%}
.strip .more{display:grid;place-items:center;background:var(--tint2);font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.dchips{display:flex;gap:var(--sp);flex-wrap:wrap;margin-bottom:var(--sp)}
.dttl{margin:0;font-size:17px;font-weight:700;letter-spacing:-.035em}
.dsub{margin:3px 0 0;color:var(--ink-2);font-size:12px}
.amt{display:flex;align-items:baseline;gap:var(--sp2);margin-top:var(--sp2);padding-bottom:var(--sp2);border-bottom:1px solid var(--line)}
.amt .k{font-size:10.5px;color:var(--ink-3)}
.amt .v{font-family:var(--mono);font-size:22px;font-weight:700;letter-spacing:-.045em}
.amt .u{font-size:12px;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:0;margin-top:var(--sp2);font-size:12px;border-top:1px solid var(--line)}
.kv dt{color:var(--ink-3);padding:var(--sp) var(--sp2) var(--sp) 0;border-bottom:1px solid var(--line);white-space:nowrap}
.kv dd{margin:0;padding:var(--sp) var(--sp3) var(--sp) 0;border-bottom:1px solid var(--line);font-weight:500;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}

.unk{color:var(--warn);font-weight:500}
.sec{margin-top:var(--sp3)}
.sec h3{margin:0 0 var(--sp);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.note{display:flex;gap:var(--sp2);align-items:flex-start;border:1px solid var(--key-line);background:var(--key-soft);border-radius:var(--r-ctl);padding:var(--sp2);margin-top:var(--sp2)}
.note.w{border-color:#e3cd9a;background:var(--warn-soft)}
