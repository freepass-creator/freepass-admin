<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>FreePass Admin · 웹·모바일 5기능 목업</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;600;700&display=swap">
  <style>
    :root {
      --navy:#1b2a4a; --sky:#9ec5f3; --ground:#f4f5f6; --panel:#fff;
      --box:#f2f3f5; --picked:#e6ecf5; --ink:#212529; --muted:#5c6268;
      --line:#eceef0; --control-line:#e1e4e7; --control-bg:#fff; --good:#15803d; --good-bg:#f0fdf4;
      --card:#fcfcfd; --card-hover:#f6f8fb; --card-selected:#edf3f9;
      --card-shadow:0 2px 8px rgba(33,37,41,.075),0 1px 2px rgba(33,37,41,.03);
      --warn:#9a6700; --warn-bg:#fff7db; --bad:#b42318; --bad-bg:#fff0ee;
      --radius:4px; --control:40px; --action:44px;
    }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html,body { margin:0; min-height:100%; background:#eef0f2; color:var(--ink); font-family:Pretendard,"Malgun Gothic",sans-serif; }
    button,input,select { font:inherit; }
    button { cursor:pointer; transition:background .16s,color .16s,box-shadow .16s,transform .16s; }
    button:disabled { cursor:not-allowed; opacity:.45; }
    .phone { width:min(100%,430px); min-height:100dvh; margin:0 auto; background:var(--ground); position:relative; }
    .statusbar { height:52px; padding:0 16px; display:flex; align-items:center; gap:10px; background:var(--panel); position:sticky; top:0; z-index:20; }
    .statusbar > div { min-width:0; flex:1; }
    .statusbar h1 { margin:0; font-size:18px; line-height:1; }
    .statusbar h1 span { margin-left:5px; color:var(--muted); font-size:14px; }
    .statusbar small { color:var(--muted); font-size:12px; }
    .sync { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--good); font-weight:700; }
    .sync::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--good); }
    main { padding:12px 12px calc(76px + env(safe-area-inset-bottom)); }
    #screen { min-height:calc(100dvh - 52px - 88px); }
    .panel-head { min-height:32px; display:flex; align-items:flex-start; gap:8px; margin-bottom:12px; }
    .panel-head h2 { margin:0; font-size:18px; line-height:1.25; }
    .panel-head span { color:var(--muted); font-size:14px; font-weight:700; }
    .panel-head p { margin:4px 0 0; color:var(--muted); font-size:12px; line-height:1.45; }
    .search { display:block; margin-bottom:10px; }
    .search-field { height:44px; display:flex; align-items:center; gap:8px; padding:0 12px; border:1px solid var(--control-line); border-radius:var(--radius); background:var(--control-bg); color:#8a939f; transition:border-color .16s,background .16s,box-shadow .16s; }
    .search-field:focus-within { border-color:#aeb8c5; background:#fff; box-shadow:0 0 0 3px rgba(27,42,74,.05); }
    .search-field input { width:100%; border:0; outline:0; color:var(--ink); font-size:16px; background:transparent; }
    .search-field > svg { flex:none; width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .filter-trigger { flex:none; width:40px; height:40px; padding:0; border:0; border-radius:var(--radius); background:transparent; color:var(--muted); display:grid; place-items:center; }
    .filter-trigger svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .filter-trigger:hover { background:var(--box); color:var(--navy); }
    .chips { display:flex; gap:6px; overflow-x:auto; margin-bottom:12px; scrollbar-width:none; }
    .chips::-webkit-scrollbar { display:none; }
    .chip { height:40px; padding:0 13px; border:0; border-radius:var(--radius); background:var(--box); color:#445064; font-size:13px; white-space:nowrap; }
    .chip.on { background:var(--navy); color:#fff; font-weight:700; }
    .list { display:grid; gap:12px; }
    .row { width:100%; min-height:88px; padding:12px; border:0; border-radius:var(--radius); background:var(--card); color:inherit; text-align:left; display:grid; grid-template-columns:72px minmax(0,1fr); align-items:center; gap:12px; box-shadow:var(--card-shadow); transition:transform .16s,box-shadow .16s,background .16s; }
    .row:hover { background:var(--card-hover); transform:translateY(-1px); box-shadow:0 4px 12px rgba(33,37,41,.095),0 1px 3px rgba(33,37,41,.035); }
    .row:active { background:#e7eef6; }
    .thumb { width:72px; aspect-ratio:4/3; border-radius:10px; background:linear-gradient(145deg,#edf1f5,#f9fafb); display:grid; place-items:center; color:#667386; font-size:11px; font-weight:650; line-height:1; text-align:center; overflow:hidden; }
    .thumb.car::before { content:""; width:54px; height:22px; border-radius:13px 16px 6px 6px; background:linear-gradient(135deg,#40516b,#1b2a4a); box-shadow:0 16px 0 -7px #9aa6b5; }
    .row-body { min-width:0; display:grid; align-content:center; gap:5px; }
    .row-title { display:flex; align-items:center; gap:6px; min-width:0; }
    .row-title b { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .meta,.sub { color:var(--muted); font-size:12px; line-height:1.3; }
    .value { font-size:14px; font-weight:800; color:var(--navy); }
    .tag { display:inline-flex; align-items:center; width:max-content; padding:5px 9px; border-radius:8px; background:#eaeef2; color:#525c68; font-size:12px; font-weight:700; }
    .tag.good { background:var(--good-bg); color:var(--good); }
    .tag.warn { background:var(--warn-bg); color:var(--warn); }
    .tag.bad { background:var(--bad-bg); color:var(--bad); }
    .identity { padding:14px; margin-bottom:10px; background:var(--card); border-radius:var(--radius); box-shadow:var(--card-shadow); }
    .identity h3 { margin:0 0 4px; font-size:18px; }
    .identity p { margin:0; color:var(--muted); font-size:12px; }
    .money { margin-top:10px; color:var(--navy); font-size:20px; font-weight:900; }
    .summary { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
    .summary div { min-height:66px; padding:10px; background:var(--card); border-radius:var(--radius); box-shadow:var(--card-shadow); }
    .summary small { display:block; margin-bottom:5px; color:var(--muted); font-size:12px; }
    .summary b { font-size:14px; }
    .section { margin-top:18px; padding-top:0; }
    .section h4 { margin:0 0 9px; font-size:14px; }
    .facts { display:grid; gap:8px; padding:12px; border-radius:var(--sales-card-radius,12px); background:var(--card); box-shadow:var(--card-shadow); }
    .fact { display:flex; justify-content:space-between; gap:14px; font-size:13px; }
    .fact span { color:var(--muted); }
    .fact b { text-align:right; }
    .offer { width:100%; padding:12px; border:0; border-radius:var(--radius); background:var(--card); color:inherit; text-align:left; display:grid; gap:5px; box-shadow:var(--card-shadow); transition:transform .16s,background .16s,box-shadow .16s; }
    .offer:hover { background:var(--card-hover); transform:translateY(-1px); }
    .offer + .offer { margin-top:8px; }
    .offer.on { background:var(--card-selected); box-shadow:0 5px 14px rgba(33,37,41,.11),0 1px 3px rgba(33,37,41,.04); }
    .offer strong { font-size:14px; }
    .offer small { color:var(--muted); font-size:12px; }
    .form { display:grid; gap:10px; }
    .form label { display:grid; gap:5px; color:var(--muted); font-size:12px; }
    .form input,.form select { height:40px; padding:0 11px; border:1px solid var(--control-line); border-radius:var(--radius); background:var(--control-bg); color:var(--ink); font-size:16px; outline:0; transition:border-color .16s,background .16s,box-shadow .16s; }
    .form input:focus,.form select:focus { border-color:#aeb8c5; background:#fff; box-shadow:0 0 0 3px rgba(27,42,74,.05); }
    .timeline { display:grid; gap:8px; }
    .step { display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:center; min-height:44px; padding:8px 10px; background:var(--box); border-radius:var(--radius); font-size:13px; }
    .step i { width:18px; height:18px; border-radius:50%; background:#cbd3dc; color:#fff; font-style:normal; display:grid; place-items:center; font-size:11px; }
    .step.done i { background:var(--good); }
    .step small { color:var(--muted); }
    .notice { padding:10px; border-radius:var(--radius); background:var(--warn-bg); color:#725000; font-size:12px; line-height:1.5; }
    .bottom-nav,.actionbar { position:fixed; left:50%; bottom:0; transform:translateX(-50%); width:min(100%,430px); z-index:30; padding-bottom:env(safe-area-inset-bottom); }
    .bottom-nav { height:calc(60px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(5,1fr); padding:0 4px env(safe-area-inset-bottom); background:var(--panel); box-shadow:0 -2px 8px rgba(15,23,42,.05); }
    .bottom-nav button { height:100%; padding:0 2px; border:0; background:transparent; color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:10px; font-weight:500; }
    .bottom-nav button.on { color:var(--navy); font-weight:700; }
    .bottom-nav svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.9; }
    .bottom-nav button.on svg { fill:rgba(27,42,74,.12); }
    .actionbar { min-height:calc(68px + env(safe-area-inset-bottom)); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--ground); display:grid; grid-template-columns:3fr 7fr; gap:8px; }
    .actionbar.three { grid-template-columns:3fr 3fr 4fr; }
    .actionbar button { min-height:44px; border:0; border-radius:var(--radius); font-size:14px; font-weight:800; }
    .primary { background:var(--navy); color:#fff; box-shadow:0 2px 6px rgba(27,42,74,.18); }
    .primary:hover { background:#14223f; box-shadow:0 4px 10px rgba(27,42,74,.22); }
    .primary:active { background:#0f1b35; transform:translateY(1px); box-shadow:0 1px 3px rgba(27,42,74,.18); }
    .secondary { background:#e6ecf5; color:var(--navy); }
    .secondary:hover { background:#dce5f0; }
    .secondary:active { background:#d2deeb; transform:translateY(1px); }
    .tertiary { background:#eceff2; color:#4f5965; }
    .tertiary:hover { background:#e3e7eb; color:var(--ink); }
    .tertiary:active { background:#dbe0e5; transform:translateY(1px); }
    .sheet-wrap { position:fixed; inset:0; z-index:60; display:grid; align-items:end; }
    .scrim { position:absolute; inset:0; border:0; background:rgba(15,23,42,.42); }
    .sheet { position:relative; width:min(100%,430px); margin:0 auto; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); background:#fff; border-radius:12px 12px 0 0; box-shadow:0 -8px 30px rgba(15,23,42,.18); }
    .sheet-head { display:flex; align-items:center; justify-content:space-between; min-height:44px; margin-bottom:4px; }
    .sheet-head h3 { margin:0; font-size:17px; }
    .sheet-head button { width:44px; height:44px; border:0; background:transparent; font-size:22px; }
    .filter-body { height:280px; display:grid; grid-template-columns:116px 1fr; }
    .filter-axes { padding:4px 0; overflow:auto; background:var(--box); }
    .filter-axes button { width:100%; min-height:50px; padding:0 12px; border:0; background:transparent; color:var(--muted); text-align:left; font-size:13px; }
    .filter-axes button.on { background:#fff; color:var(--navy); font-weight:800; }
    .filter-values { padding:12px 16px; overflow:auto; }
    .filter-values strong { display:block; min-height:32px; font-size:13px; }
    .filter-values label { min-height:44px; display:grid; grid-template-columns:22px 1fr auto; gap:8px; align-items:center; font-size:13px; }
    .filter-values small { color:var(--muted); font-variant-numeric:tabular-nums; }
    .sheet-actions { display:grid; grid-template-columns:3fr 7fr; gap:8px; }
    .sheet-actions button { min-height:44px; border:0; border-radius:var(--radius); font-weight:800; }
    .empty { padding:40px 12px; text-align:center; color:var(--muted); font-size:13px; }
    /* FreePass Sales 운영 규격: 웹/app.css의 타이포·간격·컨트롤 토큰만 공유한다. */
    :root {
      --sales-head:17px; --sales-title:14px; --sales-body:13px;
      --sales-support:12px; --sales-meta:11px; --sales-tiny:10px;
      --sales-control-font:14px; --sales-control:44px; --sales-small:32px;
      --sales-space:14px; --sales-gap:8px; --sales-control-radius:6px;
      --sales-card-radius:12px; --sales-tag-radius:8px;
      --sales-card-inset:12px; --sales-control-inset:12px;
      --sales-leading-head:1.25; --sales-leading-title:1.4;
      --sales-leading-body:1.55; --sales-leading-support:1.5; --sales-leading-meta:1.45;
    }
    html,body { font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px; line-height:1.55; letter-spacing:-.012em; font-variant-numeric:tabular-nums; font-synthesis:none; text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased; }
    .statusbar { height:60px; padding:8px 16px 10px; }
    .statusbar h1 { font-size:var(--sales-head); font-weight:650; line-height:var(--sales-leading-head); letter-spacing:-.03em; }
    .statusbar h1 span { font-size:var(--sales-title); font-weight:650; }
    .statusbar small,.sync { font-size:var(--sales-meta); }
    main { padding:var(--sales-space) 16px calc(76px + env(safe-area-inset-bottom)); }
    #screen { min-height:calc(100dvh - 60px - 88px); }
    .search { gap:var(--sales-gap); margin-bottom:var(--sales-gap); }
    .search-field { height:var(--sales-control); border-radius:var(--sales-control-radius); }
    .search-field { padding-inline:var(--sales-control-inset); }
    .search-field input { font-size:var(--sales-control-font); line-height:1; }
    .chips { gap:6px; margin-bottom:var(--sales-space); }
    .chip { height:40px; padding:0 12px; display:inline-flex; align-items:center; justify-content:center; border-radius:var(--sales-control-radius); font-size:var(--sales-body); font-weight:500; line-height:1; }
    .chip:hover { background:#e9edf2; color:var(--ink); }
    .chip.on { background:var(--picked); color:var(--navy); font-weight:650; box-shadow:inset 0 0 0 1px rgba(27,42,74,.05); }
    .list { gap:12px; }
    .row { padding:var(--sales-card-inset); border:0; border-radius:var(--sales-card-radius); background:var(--card); }
    .row:active { background:#f2f3f5; }
    .row-title b,.offer strong,.summary b { font-size:var(--sales-title); font-weight:600; line-height:var(--sales-leading-title); letter-spacing:-.01em; }
    .meta,.sub,.offer small,.identity p,.fact,.notice { font-size:var(--sales-support); line-height:var(--sales-leading-support); }
    .value { font-size:var(--sales-body); font-weight:650; line-height:var(--sales-leading-title); letter-spacing:-.01em; }
    .tag { padding:0; border-radius:0; background:transparent; font-size:var(--sales-meta); font-weight:600; line-height:var(--sales-leading-meta); letter-spacing:0; }
    .tag.good,.tag.warn,.tag.bad { background:transparent; }
    .identity,.summary div,.offer,.step { padding:var(--sales-card-inset); border-radius:var(--sales-card-radius); }
    .offer.on { background:var(--card-selected); box-shadow:0 5px 14px rgba(33,37,41,.11),0 1px 3px rgba(33,37,41,.04); }
    .identity h3 { font-size:var(--sales-head); font-weight:650; line-height:var(--sales-leading-head); letter-spacing:-.03em; }
    .money { font-size:var(--sales-head); font-weight:650; line-height:var(--sales-leading-head); letter-spacing:-.02em; }
    .section h4 { font-size:var(--sales-title); font-weight:600; line-height:var(--sales-leading-title); letter-spacing:-.01em; }
    .form { gap:var(--sales-gap); }
    .form label { gap:6px; font-size:var(--sales-support); font-weight:500; }
    .form input,.form select { height:var(--sales-control); padding-inline:var(--sales-control-inset); border-radius:var(--sales-control-radius); font-size:var(--sales-control-font); line-height:1.4; }
    .step { min-height:var(--sales-control); font-size:var(--sales-body); line-height:var(--sales-leading-body); }
    .bottom-nav button { font-size:var(--sales-tiny); font-weight:500; }
    .actionbar,.sheet-actions,.web-actions { gap:var(--sales-gap); }
    .actionbar button,.sheet-actions button,.web-actions button { min-height:var(--sales-control); padding:0 14px; border-radius:var(--sales-control-radius); font-size:var(--sales-control-font); font-weight:650; line-height:1; }
    .sheet { border-radius:18px 18px 0 0; }
    .sheet-head h3 { font-size:var(--sales-head); font-weight:650; line-height:var(--sales-leading-head); letter-spacing:-.03em; }
    .filter-axes button,.filter-values strong,.filter-values label { font-size:var(--sales-body); }
    .desktop { display:none; }
    @media (min-width:901px) {
      html,body { height:100%; overflow:hidden; background:var(--ground); }
      .phone { display:none; }
      .desktop { display:grid; grid-template-rows:56px 1fr; height:100vh; }
      .web-top { display:grid; grid-template-columns:220px 1fr auto; align-items:center; gap:20px; padding:0 20px; background:var(--navy); color:#fff; }
      .web-brand { font-family:"Exo 2","Pretendard Variable",sans-serif; font-size:var(--sales-head); font-weight:600; letter-spacing:-.02em; }
      .web-brand small { margin-left:7px; color:#b8c4d8; font-size:var(--sales-meta); font-weight:500; }
      .web-nav { height:100%; display:flex; align-items:center; justify-content:center; gap:2px; }
      .web-nav button { height:36px; padding:0 16px; border:0; border-radius:var(--sales-control-radius); background:transparent; color:#b8c4d8; font-size:var(--sales-body); font-weight:600; line-height:1; }
      .web-nav button.on { background:#fff; color:var(--navy); }
      .web-sync { color:#b9f5ca; }
      .web-workspace { min-height:0; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; padding:8px; background:#eef0f2; }
      .web-panel { min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden; padding:16px; background:var(--ground); font-size:var(--sales-body); }
      .web-panel-head { flex:none; min-height:44px; display:flex; align-items:baseline; gap:6px; }
      .web-panel-head h2 { margin:0; font-size:var(--sales-head); font-weight:650; line-height:var(--sales-leading-head); letter-spacing:-.03em; }
      .web-panel-head span { color:var(--navy); font-size:var(--sales-title); font-weight:650; }
      .web-panel-head small { color:var(--muted); font-size:var(--sales-meta); }
      .web-panel-head small { margin-left:auto; }
      .web-scroll { min-height:0; flex:1; overflow:auto; padding-right:2px; }
      .web-panel .search { margin-bottom:8px; }
      .web-panel .search-field { height:var(--sales-control); }
      .web-panel .chip { height:var(--sales-small); padding:0 11px; font-size:var(--sales-support); }
      .web-panel .row { min-height:80px; grid-template-columns:64px minmax(0,1fr); padding:var(--sales-card-inset); }
      .web-panel .thumb { width:64px; height:48px; }
      .web-panel .thumb.car::before { width:48px; }
      .web-panel .row.selected { background:var(--card-selected); transform:translateY(-1px); box-shadow:0 5px 14px rgba(33,37,41,.12),0 1px 3px rgba(33,37,41,.045); }
      .web-panel .row.selected:hover { background:#e8f0f8; }
      .web-panel .row.selected .row-title b { font-weight:650; }
      .web-panel .identity { margin-top:0; }
      .web-actions { flex:none; display:grid; grid-template-columns:3fr 7fr; gap:8px; padding-top:12px; background:var(--ground); }
      .web-actions.three { grid-template-columns:3fr 3fr 4fr; }
      .web-actions button { border:0; }
      .web-placeholder { height:100%; min-height:220px; display:grid; place-items:center; padding:24px; background:var(--box); color:var(--muted); text-align:center; font-size:13px; line-height:1.6; }
      .sheet { width:min(640px,calc(100% - 32px)); }
      .filter-body { height:360px; grid-template-columns:140px 1fr; }
    }
    :focus-visible { outline:2px solid var(--navy); outline-offset:2px; }
  </style>
</head>
<body>
<div class="phone">
  <header class="statusbar" id="status"></header>
  <main><section id="screen"></section></main>
  <nav class="bottom-nav" id="nav" aria-label="주요 업무"></nav>
  <div class="actionbar" id="actions" hidden></div>
  <div class="sheet-wrap" id="filterSheet" hidden></div>
</div>
<div class="desktop">
  <header class="web-top">
    <div class="web-brand">FreePass Admin <small>업무 한 판</small></div>
    <nav class="web-nav" id="webNav" aria-label="주요 업무"></nav>
    <span class="sync web-sync">연결 정상</span>
  </header>
  <main class="web-workspace">
    <section class="web-panel">
      <header class="web-panel-head"><h2 id="webListTitle"></h2><span id="webCount"></span><small id="webListState"></small></header>
      <div class="web-scroll" id="webList"></div>
    </section>
    <section class="web-panel">
      <header class="web-panel-head"><h2 id="webDetailTitle">상세</h2><small id="webDetailState"></small></header>
      <div class="web-scroll" id="webDetail"></div>
      <div class="web-actions" id="webDetailActions"></div>
    </section>
