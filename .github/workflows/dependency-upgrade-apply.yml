name: Apply dependency security upgrade
on:
  pull_request:
    paths:
      - '.github/workflows/dependency-upgrade-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply tested candidate
        run: |
          npm install next@16.3.6 --save-exact --package-lock-only
          npm audit fix --package-lock-only || true
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run ui:check
      - run: npm run data:check
      - run: npm run build
      - name: Enforce candidate audit boundary
        shell: bash
        run: |
          npm audit --json --omit=dev > /tmp/audit.json || true
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const v=j.vulnerabilities ?? {};
          const allowed=new Set(['gaxios','uuid']);
          const bad=Object.entries(v).filter(([name,x]) =>
            ['high','critical'].includes(x.severity) ||
            (x.severity==='moderate' && !allowed.has(name)) ||
            !['moderate','high','critical'].includes(x.severity)
          );
          if (bad.length) {
            console.error('Unexpected production audit findings', JSON.stringify(bad,null,2));
            process.exit(1);
          }
          const names=Object.keys(v).sort();
          if (names.join(',') !== 'gaxios,uuid') {
            console.error('Expected only gaxios,uuid moderate findings; got', names);
            process.exit(1);
          }
          console.log('AUDIT_BOUNDARY_PASS', j.metadata.vulnerabilities);
          NODE
      - name: Commit tested dependency files
        shell: bash
        run: |
          git config user.name "freepass-creator"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Candidate already applied"
            exit 0
          fi
          git commit -m "chore(security): upgrade Next to 16.3.6"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
