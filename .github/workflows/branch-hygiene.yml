            work/gpt/d6-workflow-shadow-adoption-20260920|63e88a35516efccb4618a85071b585f001d2852c
            c-adoption/core-contract-shadow|b76a70fb58a0317678c713ff031be34eb633f844
            recovery/pr92-modernize-20260926|267a68ec8373219bfc6cba608d8b837919cb431f
            work/gpt/admin-p23-settlement-state-machine-20260921|0b31212cb8e25edcd9ddc0b416ff0bcf886ccfd3
            work/gpt/esign-port-implementation-r1|a0c8ced9e2e681e92669ebbd11db068f98ca5883
            tmp/export-pr92-ui-images-20260926|f9af0ba7e23228081fafe78113d7d18c0605e080
            tmp/render-pr92-head-20260926|bb35208e5d10227f061aa52f3781e4f942a21380
            tmp/render-pr92-linefree-20260926|0336de13db06d602ae6896b5c8e5ea7fef8db6be
            backend/admin-journey-bridge|8d9e95c11a6b0438f08bef7dfda40bedac268119
            backend/contract-termination|27e3c4385132f45715f388c82c115151e05bd634
            backend/esign-pdf-renderer-v2|82b3348e35f46086685836d9fdcec4d6e6dcb78a
            backend/settlement-delivery-gate|f164090ba2d4eafb91a29b21d094fffe79364973
            backend/settlement-eligibility-gate|8d9e95c11a6b0438f08bef7dfda40bedac268119
            feat/intake-contract-conditions-20260923|185f5049333463026234feb8e9c5318620917776
            work/gpt/admin-function-mainline-20260925|4c37c736416ac897db6435cff171608efd94485f
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          deleted=0
          skipped=0

          while IFS='|' read -r branch expected_sha; do
            [[ -n "${branch:-}" ]] || continue
            [[ "$branch" != "main" ]] || { echo "::error::refusing to delete main"; exit 1; }

            remote_ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$remote_ref"; then
              echo "already absent: $branch"
              continue
            fi

            current_sha="$(git rev-parse "$remote_ref")"
            if [[ "$current_sha" != "$expected_sha" ]]; then
              echo "::warning::skip changed branch $branch: expected $expected_sha, found $current_sha"
              skipped=$((skipped + 1))
              continue
            fi

            echo "deleting merged branch: $branch @ $current_sha"
            git push origin --delete "$branch"
            deleted=$((deleted + 1))
          done <<< "$VERIFIED_BRANCHES"

          echo "deleted=$deleted skipped=$skipped"

  delete-merged-pr-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Delete merged PR branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          echo "deleting merged PR branch: $HEAD_REF"
          git push origin --delete "$HEAD_REF"
