name: Visual QA

on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'src/domain/settlement/**'
      - 'scripts/visual-qa.cjs'
      - 'package.json'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FPA_DEMO: "on"
      ERP5_WRITE: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app
        run: npm ci
      - name: Install QA browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start actual routes
        run: |
          npm run dev -- -H 127.0.0.1 -p 3100 > /tmp/freepass-admin-visual.log 2>&1 &
          echo $! > /tmp/freepass-admin-visual.pid
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/products >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          cat /tmp/freepass-admin-visual.log
          exit 1
      - name: Run actual-route Visual QA
        env:
          VISUAL_QA_OUT: artifacts/visual-qa
        run: npm run visual:qa -- http://127.0.0.1:3100
      - name: Save server log
        if: always()
        run: |
          mkdir -p artifacts/visual-qa
          cp /tmp/freepass-admin-visual.log artifacts/visual-qa/server.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa-${{ github.sha }}
          path: artifacts/visual-qa
          retention-days: 7
          if-no-files-found: error
