name: freepass-data-persistence

on:
  # This workflow is a required branch-protection check. Required workflows
  # must create a check run for every PR; a paths filter leaves unrelated PRs
  # permanently blocked with "Expected — Waiting for status to be reported".
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-freepass-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCLOUD_PROJECT: freepasserp5
      ERP5_WRITE: "on"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        run: npm ci

      - name: Firestore FreePass Data persistence
        run: npx --yes firebase-tools@15.30.2 emulators:exec --only firestore --project freepasserp5 "npm run test:freepass-data-firestore"
