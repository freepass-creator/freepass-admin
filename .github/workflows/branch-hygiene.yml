            fix/intake-server-ledger-kind-validation-20260923|be0155226e454ba7218f9984c266dc2ac1f275ef
            fix/product-search-required-perks-20260923|435563b9d72eb383d98b9e4d956b6609cce2eb1e
            fix/product-stable-source-revision-20260922|292139aa2923f5cf48cec5452ee1225331df51a5
