name: Admin operational verification
on:
  push:
    branches: [main, release/admin-operational-20260925]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: admin-operational-${{ github.ref }}
  cancel-in-progress: false
env:
  NEXT_TELEMETRY_DISABLED: '1'
  ERP5_WRITE: 'off'
  FREEPASS_DATA_ADMIN_CATALOG_READ_MODE: OBSERVE
jobs:
  code:
    if: github.event.head_commit.message != 'release-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Provenance and failure propagation
        run: |
          set -euo pipefail
          mkdir -p artifacts/operational
          git rev-parse HEAD | tee artifacts/operational/checked-sha.txt
          node --version | tee artifacts/operational/node-version.txt
          if bash -eo pipefail -c 'false | tee /dev/null'; then
            echo 'Failure propagation is broken'; exit 1
          fi
      - run: npm ci
      - name: Types and complete tests
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee artifacts/operational/typecheck.log
          npm test 2>&1 | tee artifacts/operational/tests.log
      - name: UI and data boundaries
        run: |
          set -euo pipefail
          npm run ui:check 2>&1 | tee artifacts/operational/ui.log
          npm run data:check 2>&1 | tee artifacts/operational/data.log
      - name: Production build
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee artifacts/operational/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-code-${{ github.sha }}
          path: artifacts/operational
          retention-days: 7
  persistence:
    if: github.event.head_commit.message != 'release-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: freepasserp5
      ERP5_WRITE: 'on'
      PUBLIC_BASE_URL: https://admin.example.test
      ERP5_STORAGE_BUCKET: freepasserp5.appspot.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Isolated Firestore and private PDF persistence
        run: |
          set -euo pipefail
          mkdir -p artifacts/operational-persistence
          git rev-parse HEAD | tee artifacts/operational-persistence/checked-sha.txt
          npx --yes firebase-tools@15.30.2 emulators:exec --config firebase.release-test.json --only firestore,storage --project freepasserp5 \
            'npm run test:freepass-data-firestore && npx tsx scripts/verify-esign-pdf-emulator.mts' \
            2>&1 | tee artifacts/operational-persistence/emulators.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-persistence-${{ github.sha }}
          path: artifacts/operational-persistence
          retention-days: 7
  browser:
    if: github.event.head_commit.message != 'release-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UI_BROWSER_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Isolated browser tools
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/admin-browser-tools" --no-save --package-lock=false playwright@1.55.0 esbuild@0.25.0
          node "$RUNNER_TEMP/admin-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify production routes and real UI components
        env:
          UI_BROWSER_TOOLS: ${{ runner.temp }}/admin-browser-tools
        run: |
          set -euo pipefail
          node scripts/check-next-runtime.mjs
          node scripts/check-ui-browser.mjs
          node scripts/check-ui-filter-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operational-browser-${{ github.sha }}
          path: |
            artifacts/next-runtime/
            artifacts/ui-browser/
            artifacts/ui-filter-browser/
          retention-days: 7
