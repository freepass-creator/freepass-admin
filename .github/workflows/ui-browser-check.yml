name: UI browser check
on:
  pull_request:
    paths:
      - 'src/app/**'
      - 'scripts/browser/**'
      - 'scripts/check-ui-browser.mjs'
      - '.github/workflows/ui-browser-check.yml'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: ui-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ERP5_WRITE: 'off'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/freepass-browser-tools" --no-save --package-lock=false playwright@1.55.0 esbuild@0.25.0
          node "$RUNNER_TEMP/freepass-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify actual components and stylesheet cascade
        run: UI_BROWSER_TOOLS="$RUNNER_TEMP/freepass-browser-tools" node scripts/check-ui-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-browser-${{ github.event.pull_request.head.sha }}
          path: artifacts/ui-browser/
          retention-days: 7
          if-no-files-found: warn
